<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080f">
<meta name="description" content="kidandcat — a living sakura tree of tools.">
<title>kidandcat</title>
<style>
:root{
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg-0:#05060c; --bg-1:#0a0c17;
  --ink:#eef1fb; --ink-dim:#9aa2be; --ink-faint:#5a627e;
  --line-strong:rgba(150,175,255,0.30);
  --accent:#57e6ff; --accent-3:#ff6ea9;
  --panel:rgba(12,16,32,0.55); --panel-brd:rgba(120,150,230,0.22);
  --string:rgba(255,210,230,0.55); --glow-a:rgba(87,230,255,0.45);
  --badge-ring:rgba(255,255,255,0.14); --badge-shadow:0 10px 28px -8px rgba(0,0,0,.65);
}
html[data-theme="light"]{
  --bg-0:#e8ecf6; --bg-1:#f3f5fb;
  --ink:#161a26; --ink-dim:#4c5470; --ink-faint:#8b93ac;
  --line-strong:rgba(40,60,130,0.22);
  --accent:#0a97b8; --accent-3:#d24f86;
  --panel:rgba(255,255,255,0.72); --panel-brd:rgba(40,60,130,0.14);
  --string:rgba(120,60,80,0.4); --glow-a:rgba(10,151,184,0.3);
  --badge-ring:rgba(0,0,0,0.08); --badge-shadow:0 12px 28px -12px rgba(30,45,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-sans); color:var(--ink);
  background:var(--bg-1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease, color .5s ease;
}
#c{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#labels > *{pointer-events:auto}

.hud{position:fixed;inset:0;z-index:6;pointer-events:none}
.hud .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--line-strong)}
.hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
.hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
.hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
.hud .br{bottom:14px;right:14px;border-left:0;border-top:0}

.chrome{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(14px,2vw,22px);
}
.chrome a,.chrome button{pointer-events:auto}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:800;letter-spacing:-0.02em;font-size:clamp(1rem,2vw,1.15rem);text-transform:none;
}
.brand .cat{
  background:linear-gradient(180deg, var(--accent-3) 0%, color-mix(in oklab, var(--accent) 50%, var(--accent-3)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-a);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-a)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.toggle{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border:1px solid var(--panel-brd);
  padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
}
.toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle svg{width:14px;height:14px;display:block}
.toggle .ti-sun{display:none}
html[data-theme="light"] .toggle .ti-sun{display:block}
html[data-theme="light"] .toggle .ti-moon{display:none}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.links{display:flex;gap:14px}
.links a{color:var(--ink-dim);text-decoration:none}
.links a:hover{color:var(--ink)}

/* Tool badges — CSS2D labels */
.orn{
  display:block;text-decoration:none;color:inherit;
  transform:translate(-50%, 0);
  will-change:transform;
}
.orn::before{
  content:"";position:absolute;left:50%;top:-22px;width:1px;height:22px;
  background:linear-gradient(180deg, transparent, var(--string));transform:translateX(-50%);
}
.orn .knot{
  position:absolute;left:50%;top:-3px;width:6px;height:6px;border-radius:50%;
  background:color-mix(in oklab, #6b3f2a 70%, var(--accent-3));transform:translateX(-50%);
}
.orn .badge{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:var(--badge-bg,#111);border:1.5px solid var(--badge-ring);
  box-shadow:var(--badge-shadow),0 0 0 1px color-mix(in oklab,var(--brand,#fff) 35%,transparent),
    0 0 20px -6px color-mix(in oklab,var(--brand,#fff) 55%,transparent);
  transition:transform .18s cubic-bezier(.2,.7,.3,1);overflow:hidden;
}
.orn:hover .badge{transform:scale(1.12)}
.orn:focus-visible .badge{outline:2px solid var(--accent);outline-offset:3px}
.orn .badge img{width:68%;height:68%;object-fit:contain;display:block}
.orn .label{
  position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  font-family:var(--font-mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  text-shadow:0 1px 8px var(--bg-0);
}
.orn:hover .label{opacity:1}
@media (max-width:560px){
  .orn .badge{width:38px;height:38px;border-radius:11px}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dot{box-shadow:none}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.172.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div class="hud" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>

</div>
<div class="chrome">
  <header class="top">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>kidand<span class="cat">cat</span></a>
    <span>under the sakura</span>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle color theme" aria-pressed="false">

      <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      <span>theme</span>
    </button>

    <nav class="links" aria-label="Elsewhere">

      <a href="https://x.com/kidandcat" target="_blank" rel="me noopener noreferrer">x</a>
    </nav>
  </footer>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

/* ============================================================
   3D living sakura — Three.js
   Recursive tapered branches + instanced blossom canopy.
   ============================================================ */

const TOOLS = [
  { name: "Hyperframes", href: "https://hyperframes.heygen.com/", icon: "icons/hyperframes.png", brand: "#A78BFA", bg: "#14101f" },
  { name: "Impeccable",  href: "https://impeccable.style/",       icon: "icons/impeccable.png",  brand: "#C9A227", bg: "#111111" },
  { name: "Claude",      href: "https://claude.ai/code",          icon: "icons/claude.png",      brand: "#D97757", bg: "#2a1810" },
  { name: "Grok",        href: "https://grok.x.ai/",              icon: "icons/grok.png",        brand: "#E8E8E8", bg: "#0a0a0a" },
  { name: "Takan",       href: "https://takan.es",                icon: "icons/takan.png",       brand: "#6C5CE7", bg: "#14102a" },
  { name: "shot",        href: "https://github.com/kidandcat/shot", icon: "icons/shot.png",      brand: "#F0F6FC", bg: "#0d1117" },
  { name: "Flutter",     href: "https://flutter.dev",             icon: "icons/flutter.png",     brand: "#45D1FD", bg: "#042a3a" },
  { name: "Go",          href: "https://go.dev",                  icon: "icons/go.png",          brand: "#00ADD8", bg: "#06222b" },
  { name: "Rust",        href: "https://www.rust-lang.org",       icon: "icons/rust.png",        brand: "#DEA584", bg: "#1a120c" },
  { name: "Tailscale",   href: "https://tailscale.com",           icon: "icons/tailscale.png",   brand: "#8B93A7", bg: "#111318" }
];

const root = document.documentElement;
const KEY = "kac-theme";
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

function applyTheme(t){
  root.setAttribute("data-theme", t);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "dark" ? "#05060c" : "#eef1f7");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.setAttribute("aria-pressed", String(t === "light"));
  applySceneTheme(t === "light");
}
let saved; try{ saved = localStorage.getItem(KEY); }catch(e){}
const initialLight = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(KEY, next); }catch(e){}
});

/* ---------- RNG ---------- */
let seed = 20260731;
function rand(){
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let n = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  n = (n + Math.imul(n ^ (n >>> 7), 61 | n)) ^ n;
  return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
}
function rrange(a, b){ return a + rand() * (b - a); }

/* ---------- Scene ---------- */
const canvas = document.getElementById("c");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
} catch (err) {
  document.body.insertAdjacentHTML("beforeend",
    '<p style="position:fixed;inset:0;display:grid;place-items:center;color:#eef1fb;font:14px/1.5 system-ui;padding:24px;text-align:center;z-index:20">WebGL is required for this page.</p>');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.id = "labels";
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
labelRenderer.domElement.style.zIndex = "2";
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(4.2, 3.6, 7.2);

const controls = new OrbitControls(camera, labelRenderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.5;
controls.maxDistance = 16;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 2.4, 0);
controls.autoRotate = !reduce.matches;
controls.autoRotateSpeed = 0.35;
// don't auto-rotate while user interacts
controls.addEventListener("start", () => { controls.autoRotate = false; });

/* Lights */
const hemi = new THREE.HemisphereLight(0xb8c8ff, 0x2a1a18, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0e0, 1.15);
sun.position.set(6, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff9ec8, 0.45);
rim.position.set(-5, 3, -4);
scene.add(rim);
const fill = new THREE.PointLight(0xffb0d0, 0.35, 20, 2);
fill.position.set(0, 4, 2);
scene.add(fill);

/* Ground */
const groundGeo = new THREE.CircleGeometry(9, 48);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0a0c14, roughness: 0.95, metalness: 0.05, transparent: true, opacity: 0.85
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* Soft fog */
scene.fog = new THREE.FogExp2(0x0a0c17, 0.028);

function applySceneTheme(light){
  if(light){
    scene.fog.color.set(0xe8ecf6);
    scene.fog.density = 0.018;
    groundMat.color.set(0xd8dce8);
    hemi.color.set(0xe8f0ff); hemi.groundColor.set(0xc8a090); hemi.intensity = 0.75;
    sun.intensity = 1.0; sun.color.set(0xfff8f0);
    rim.intensity = 0.3;
    renderer.setClearColor(0x000000, 0);
    document.body.style.background = "";
  } else {
    scene.fog.color.set(0x0a0c17);
    scene.fog.density = 0.028;
    groundMat.color.set(0x0a0c14);
    hemi.color.set(0xb8c8ff); hemi.groundColor.set(0x2a1a18); hemi.intensity = 0.55;
    sun.intensity = 1.15; sun.color.set(0xfff0e0);
    rim.intensity = 0.45;
  }
}

/* ---------- Materials ---------- */
const barkMat = new THREE.MeshStandardMaterial({
  color: 0x4a3228, roughness: 0.88, metalness: 0.05
});
const barkDarkMat = new THREE.MeshStandardMaterial({
  color: 0x3a241c, roughness: 0.9, metalness: 0.04
});

/* Flower petal geometry (simple double-sided soft disc cluster unit) */
function makeFlowerGeo(){
  // 5-petal flat flower
  const shape = new THREE.Shape();
  for(let i = 0; i < 5; i++){
    const a0 = (i / 5) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
    const a2 = ((i + 1) / 5) * Math.PI * 2 - Math.PI / 2;
    const rIn = 0.04, rOut = 0.14;
    if(i === 0) shape.moveTo(Math.cos(a0) * rIn, Math.sin(a0) * rIn);
    shape.quadraticCurveTo(
      Math.cos(a1) * rOut, Math.sin(a1) * rOut,
      Math.cos(a2) * rIn, Math.sin(a2) * rIn
    );
  }
  const geo = new THREE.ShapeGeometry(shape, 6);
  geo.center();
  return geo;
}

const flowerMat = new THREE.MeshStandardMaterial({
  color: 0xff9ec4,
  emissive: 0xff6aa0,
  emissiveIntensity: 0.18,
  roughness: 0.65,
  metalness: 0.0,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.92,
  depthWrite: false
});
const flowerMatDeep = new THREE.MeshStandardMaterial({
  color: 0xf070a8,
  emissive: 0xd04080,
  emissiveIntensity: 0.12,
  roughness: 0.7,
  metalness: 0.0,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.88,
  depthWrite: false
});
const flowerMatLite = new THREE.MeshStandardMaterial({
  color: 0xffc8dc,
  emissive: 0xffa0c0,
  emissiveIntensity: 0.1,
  roughness: 0.6,
  metalness: 0.0,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.9,
  depthWrite: false
});

/* ---------- Tree build ---------- */
const treeRoot = new THREE.Group();
scene.add(treeRoot);

const branchGroups = []; // for wind
const hangAnchors = [];  // world-ish local points for tools
const flowerPositions = []; // for instancing

const dummy = new THREE.Object3D();
const _q = new THREE.Quaternion();
const _up = new THREE.Vector3(0, 1, 0);
const _dir = new THREE.Vector3();

function addBranchMesh(from, to, radiusBottom, radiusTop, radial = 7){
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  if(len < 0.01) return null;
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, len, radial);
  geo.translate(0, len / 2, 0);
  const mesh = new THREE.Mesh(geo, radiusBottom > 0.12 ? barkDarkMat : barkMat);
  mesh.position.copy(from);
  mesh.quaternion.setFromUnitVectors(_up, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function growBranch(parentGroup, origin, direction, length, radius, depth, maxDepth){
  direction = direction.clone().normalize();
  // slight droop for sakura weep on outer limbs
  if(depth > 2) direction.y -= 0.08;
  direction.normalize();

  const end = origin.clone().addScaledVector(direction, length);
  const mesh = addBranchMesh(origin, end, radius, radius * 0.62, depth < 2 ? 10 : 6);
  if(mesh) parentGroup.add(mesh);

  // wind node: a group at end that children attach to
  const joint = new THREE.Group();
  joint.position.copy(end);
  parentGroup.add(joint);
  joint.userData = {
    phase: rrange(0, Math.PI * 2),
    flex: 0.012 + depth * 0.01,
    depth,
    restQuat: joint.quaternion.clone()
  };
  branchGroups.push(joint);

  if(depth >= maxDepth || length < 0.18){
    // hang points on outer tips (world score filled after matrix update)
    if(depth >= 3 && rand() < 0.4){
      hangAnchors.push({ group: joint, local: new THREE.Vector3(0, -0.08, 0), score: 0 });
    }
    return joint;
  }

  // children
  let childCount;
  if(depth === 0) childCount = 5;
  else if(depth === 1) childCount = 4;
  else if(depth === 2) childCount = 3;
  else childCount = rand() < 0.55 ? 2 : 3;

  // first child continues mostly upward
  for(let c = 0; c < childCount; c++){
    const spread = depth === 0
      ? rrange(-0.85, 0.85)
      : rrange(-0.7, 0.7);
    const lift = depth === 0 ? rrange(0.35, 0.75) : rrange(-0.15, 0.55);
    // build orthonormal basis around direction
    const axis = new THREE.Vector3(rrange(-1,1), rrange(-0.2,1), rrange(-1,1)).normalize();
    const childDir = direction.clone()
      .applyAxisAngle(axis, spread)
      .add(new THREE.Vector3(0, lift * 0.35, 0))
      .normalize();

    // fan primary crown at trunk split
    if(depth === 0){
      const a = (c / childCount) * Math.PI * 1.6 - Math.PI * 0.8;
      childDir.set(Math.sin(a) * 0.85, 0.55 + rrange(0, 0.25), Math.cos(a) * 0.55 + rrange(-0.15, 0.15)).normalize();
    }

    const childLen = length * rrange(0.62, 0.78);
    const childRad = radius * rrange(0.55, 0.68);
    growBranch(joint, new THREE.Vector3(0, 0, 0), childDir, childLen, childRad, depth + 1, maxDepth);
  }

  // occasional side spur
  if(depth > 0 && depth < maxDepth - 1 && rand() < 0.4){
    const spurDir = direction.clone()
      .applyAxisAngle(new THREE.Vector3(0,1,0), rrange(-1.2, 1.2))
      .add(new THREE.Vector3(0, rrange(-0.3, 0.2), 0))
      .normalize();
    growBranch(joint, new THREE.Vector3(0, 0, 0), spurDir, length * rrange(0.35, 0.5), radius * 0.45, depth + 2, maxDepth);
  }

  return joint;
}

function buildTree(){
  // clear previous
  while(treeRoot.children.length) treeRoot.remove(treeRoot.children[0]);
  branchGroups.length = 0;
  hangAnchors.length = 0;
  flowerPositions.length = 0;
  seed = 20260731;

  const mobile = window.innerWidth < 720;
  const maxDepth = mobile ? 5 : 6;

  // trunk
  const trunkGroup = new THREE.Group();
  treeRoot.add(trunkGroup);

  const trunkStart = new THREE.Vector3(0, 0, 0);
  const trunkDir = new THREE.Vector3(0.02, 1, -0.01).normalize();
  const trunkLen = mobile ? 2.1 : 2.45;
  const trunkR = mobile ? 0.16 : 0.2;

  // flared base
  const baseGeo = new THREE.CylinderGeometry(trunkR * 1.55, trunkR * 2.1, 0.35, 12);
  const base = new THREE.Mesh(baseGeo, barkDarkMat);
  base.position.y = 0.12;
  base.castShadow = true;
  base.receiveShadow = true;
  trunkGroup.add(base);

  growBranch(trunkGroup, trunkStart, trunkDir, trunkLen, trunkR, 0, maxDepth);
  treeRoot.updateMatrixWorld(true);

  // Score hang anchors in world space
  for(const h of hangAnchors){
    const wp = new THREE.Vector3();
    h.group.getWorldPosition(wp);
    h.score = wp.y + Math.hypot(wp.x, wp.z) * 0.35;
  }

  // Dense canopy: outer shell of blossoms (world space, under treeRoot)
  const crownCenter = new THREE.Vector3(0, trunkLen * 1.05, 0);
  const fillN = mobile ? 900 : 1800;
  for(let i = 0; i < fillN; i++){
    const theta = rand() * Math.PI * 2;
    const phi = Math.acos(rrange(-0.15, 1)); // bias upper hemisphere
    let r = Math.cbrt(rand());
    // denser outer shell (classic sakura mass)
    if(rand() < 0.65) r = 0.55 + r * 0.45;
    const rx = mobile ? 2.1 : 2.55;
    const ry = mobile ? 1.45 : 1.75;
    const rz = mobile ? 1.9 : 2.25;
    const p = new THREE.Vector3(
      crownCenter.x + Math.sin(phi) * Math.cos(theta) * rx * r,
      crownCenter.y + Math.cos(phi) * ry * r + 0.1,
      crownCenter.z + Math.sin(phi) * Math.sin(theta) * rz * r
    );
    if(p.y < 1.35) continue;
    flowerPositions.push({
      p,
      s: rrange(0.7, 1.45),
      mat: (rand() * 3) | 0,
      phase: rrange(0, Math.PI * 2)
    });
  }
  // secondary softer inner fill
  const innerN = mobile ? 250 : 450;
  for(let i = 0; i < innerN; i++){
    const theta = rand() * Math.PI * 2;
    const phi = Math.acos(rrange(0, 1));
    const r = Math.cbrt(rand()) * 0.7;
    const p = new THREE.Vector3(
      Math.sin(phi) * Math.cos(theta) * 1.6 * r,
      trunkLen * 0.95 + Math.cos(phi) * 1.1 * r,
      Math.sin(phi) * Math.sin(theta) * 1.4 * r
    );
    if(p.y < 1.5) continue;
    flowerPositions.push({ p, s: rrange(0.5, 1.0), mat: (rand() * 3) | 0, phase: rrange(0, Math.PI * 2) });
  }

  buildFlowerInstances();
  placeTools();
}

let flowerMeshes = [];
function buildFlowerInstances(){
  flowerMeshes.forEach(m => {
    treeRoot.remove(m);
    m.geometry.dispose();
  });
  flowerMeshes = [];

  const geo = makeFlowerGeo();
  const mats = [flowerMat, flowerMatDeep, flowerMatLite];
  const buckets = [[], [], []];
  for(const f of flowerPositions) buckets[f.mat].push(f);

  for(let b = 0; b < 3; b++){
    const list = buckets[b];
    if(!list.length) continue;
    const mesh = new THREE.InstancedMesh(geo, mats[b], list.length);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = true;
    for(let i = 0; i < list.length; i++){
      const f = list[i];
      dummy.position.copy(f.p);
      dummy.scale.setScalar(f.s);
      // face somewhat outward / random
      dummy.rotation.set(rrange(-0.6, 0.6), rrange(0, Math.PI * 2), rrange(-0.6, 0.6));
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.userData.list = list;
    treeRoot.add(mesh);
    flowerMeshes.push(mesh);
  }
}

/* Falling petals */
const PETAL_N = 80;
const petalGeo = new THREE.PlaneGeometry(0.1, 0.14);
const petalMat = new THREE.MeshStandardMaterial({
  color: 0xffb0d0, emissive: 0xff80b0, emissiveIntensity: 0.15,
  side: THREE.DoubleSide, transparent: true, opacity: 0.85, depthWrite: false
});
const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_N);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(petalMesh);
const petals = [];
for(let i = 0; i < PETAL_N; i++){
  petals.push({
    x: rrange(-3, 3), y: rrange(2, 6), z: rrange(-3, 3),
    vx: rrange(-0.15, 0.15), vy: rrange(-0.35, -0.12), vz: rrange(-0.15, 0.15),
    rot: rrange(0, Math.PI * 2), vrot: rrange(-1.5, 1.5),
    phase: rrange(0, Math.PI * 2), amp: rrange(0.15, 0.45),
    alive: rand() < 0.4
  });
}

/* Tools as CSS2D */
const toolObjects = [];
function placeTools(){
  // clear old labels
  toolObjects.forEach(o => {
    if(o.parent) o.parent.remove(o);
    o.element?.remove();
  });
  toolObjects.length = 0;

  hangAnchors.sort((a, b) => b.score - a.score);
  const chosen = [];
  const minD = 0.9;
  for(const h of hangAnchors){
    if(chosen.length >= TOOLS.length) break;
    // world pos approx
    const wp = new THREE.Vector3();
    h.group.getWorldPosition(wp);
    wp.add(h.local);
    let ok = true;
    for(const c of chosen){
      if(wp.distanceTo(c.wp) < minD){ ok = false; break; }
    }
    if(ok && wp.y > 1.0 && wp.y < 4.5) chosen.push({ ...h, wp });
  }
  // pad with crown points
  while(chosen.length < TOOLS.length && flowerPositions.length){
    const f = flowerPositions[(rand() * flowerPositions.length) | 0];
    let ok = true;
    for(const c of chosen){
      if(f.p.distanceTo(c.wp) < minD){ ok = false; break; }
    }
    if(ok && f.p.y > 1.2){
      const g = new THREE.Group();
      g.position.copy(f.p);
      treeRoot.add(g);
      chosen.push({ group: g, local: new THREE.Vector3(0, -0.15, 0), wp: f.p.clone() });
    }
  }

  for(let t = 0; t < TOOLS.length && t < chosen.length; t++){
    const tool = TOOLS[t];
    const anchor = chosen[t];
    const el = document.createElement("a");
    el.className = "orn";
    el.href = tool.href;
    el.target = "_blank";
    el.rel = "noopener noreferrer";
    el.title = tool.name;
    el.innerHTML = `<span class="knot" aria-hidden="true"></span><span class="badge"><img alt="" width="32" height="32" decoding="async" src="${tool.icon}"></span><span class="label"></span>`;
    el.style.setProperty("--brand", tool.brand);
    el.querySelector(".badge").style.background = tool.bg;
    el.querySelector(".label").textContent = tool.name;

    const obj = new CSS2DObject(el);
    obj.position.copy(anchor.local);
    obj.position.y -= 0.15 + (t % 3) * 0.05;
    obj.userData = { phase: t * 0.8, drop: 0.12 + (t % 3) * 0.04, swing: 0 };
    anchor.group.add(obj);
    toolObjects.push(obj);
  }
}

/* ---------- Animation ---------- */
const clock = new THREE.Clock();
let windGust = 0.15;
let windTarget = 0.15;
let windT = 0;

function animateBranches(t){
  windT -= 0.016;
  if(windT <= 0){
    windTarget = rrange(0.05, 0.35);
    windT = rrange(2, 5);
  }
  windGust += (windTarget - windGust) * 0.02;
  const breeze = Math.sin(t * 0.7) * 0.4 + Math.sin(t * 0.23) * 0.25 + windGust;

  for(const g of branchGroups){
    const d = g.userData;
    if(!d || d.depth < 1) continue;
    const amp = d.flex * (0.3 + d.depth * 0.35) * breeze;
    const ax = Math.sin(t * 1.1 + d.phase) * amp;
    const az = Math.cos(t * 0.9 + d.phase * 1.3) * amp * 0.7;
    g.rotation.x = ax;
    g.rotation.z = az;
  }

  // gentle flower bob via re-instance occasionally is expensive —
  // skip; branch wind moves parents enough
}

function animatePetals(dt, t){
  for(let i = 0; i < PETAL_N; i++){
    const p = petals[i];
    if(!p.alive){
      if(rand() < 0.01){
        p.alive = true;
        p.x = rrange(-2.5, 2.5);
        p.y = rrange(3.5, 5.5);
        p.z = rrange(-2.5, 2.5);
        p.vy = rrange(-0.4, -0.15);
        p.vx = rrange(-0.2, 0.2);
        p.vz = rrange(-0.2, 0.2);
      } else {
        dummy.position.set(0, -10, 0);
        dummy.scale.set(0, 0, 0);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
        continue;
      }
    }
    p.vy -= 0.15 * dt;
    p.vx += Math.sin(t + p.phase) * 0.02 * dt;
    p.x += (p.vx + Math.sin(t * 1.5 + p.phase) * p.amp * 0.3) * dt;
    p.y += p.vy * dt;
    p.z += (p.vz + Math.cos(t * 1.2 + p.phase) * p.amp * 0.25) * dt;
    p.rot += p.vrot * dt;
    if(p.y < 0.05){ p.alive = false; }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rot, p.rot * 0.7, p.rot * 0.3);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

function animateTools(t){
  for(const o of toolObjects){
    const u = o.userData;
    const sway = Math.sin(t * 1.2 + u.phase) * 0.08 * windGust;
    o.position.x = Math.sin(sway) * u.drop;
    o.position.y = -0.12 - Math.cos(sway) * 0.02;
  }
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  labelRenderer.setSize(w, h);
}
window.addEventListener("resize", onResize);

// click gust
window.addEventListener("pointerdown", (e) => {
  if(e.target.closest && e.target.closest("a,button")) return;
  windTarget = 0.7;
  windT = 1.5;
});

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(!reduce.matches){
    animateBranches(t);
    animatePetals(dt, t);
    animateTools(t);
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// init
applyTheme(initialLight ? "light" : "dark");
buildTree();
frame();
</script>

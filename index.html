<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080f">
<meta name="description" content="kidandcat — a living sakura tree of tools.">
<title>kidandcat</title>
<style>
:root{
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg-0:#05060c; --bg-1:#0a0c17;
  --ink:#eef1fb; --ink-dim:#9aa2be; --ink-faint:#5a627e;
  --line-strong:rgba(150,175,255,0.30);
  --accent:#57e6ff; --accent-3:#ff6ea9;
  --panel:rgba(12,16,32,0.55); --panel-brd:rgba(120,150,230,0.22);
  --string:rgba(255,210,230,0.55); --glow-a:rgba(87,230,255,0.45);
  --badge-ring:rgba(255,255,255,0.14); --badge-shadow:0 10px 28px -8px rgba(0,0,0,.65);
}
html[data-theme="light"]{
  --bg-0:#e8ecf6; --bg-1:#f3f5fb;
  --ink:#161a26; --ink-dim:#4c5470; --ink-faint:#8b93ac;
  --line-strong:rgba(40,60,130,0.22);
  --accent:#0a97b8; --accent-3:#d24f86;
  --panel:rgba(255,255,255,0.72); --panel-brd:rgba(40,60,130,0.14);
  --string:rgba(120,60,80,0.4); --glow-a:rgba(10,151,184,0.3);
  --badge-ring:rgba(0,0,0,0.08); --badge-shadow:0 12px 28px -12px rgba(30,45,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-sans); color:var(--ink);
  background:var(--bg-1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease, color .5s ease;
}
#c{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
#labels > *{pointer-events:auto}

.hud{position:fixed;inset:0;z-index:6;pointer-events:none}
.hud .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--line-strong)}
.hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
.hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
.hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
.hud .br{bottom:14px;right:14px;border-left:0;border-top:0}

.chrome{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(14px,2vw,22px);
}
.chrome a,.chrome button{pointer-events:auto}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:800;letter-spacing:-0.02em;font-size:clamp(1rem,2vw,1.15rem);text-transform:none;
}
.brand .cat{
  background:linear-gradient(180deg, var(--accent-3) 0%, color-mix(in oklab, var(--accent) 50%, var(--accent-3)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-a);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-a)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.toggle{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border:1px solid var(--panel-brd);
  padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
}
.toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle svg{width:14px;height:14px;display:block}
.toggle .ti-sun{display:none}
html[data-theme="light"] .toggle .ti-sun{display:block}
html[data-theme="light"] .toggle .ti-moon{display:none}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.links{display:flex;gap:14px}
.links a{color:var(--ink-dim);text-decoration:none}
.links a:hover{color:var(--ink)}

/* Tool badges — CSS2D labels */
.orn{
  display:block;text-decoration:none;color:inherit;
  transform:translate(-50%, 0);
  will-change:transform;
  pointer-events:auto;
  cursor:pointer;
}
.orn::before{
  content:"";position:absolute;left:50%;top:-22px;width:1px;height:22px;
  background:linear-gradient(180deg, transparent, var(--string));transform:translateX(-50%);
}
.orn .knot{
  position:absolute;left:50%;top:-3px;width:6px;height:6px;border-radius:50%;
  background:color-mix(in oklab, #6b3f2a 70%, var(--accent-3));transform:translateX(-50%);
}
.orn .badge{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:var(--badge-bg,#111);border:1.5px solid var(--badge-ring);
  box-shadow:var(--badge-shadow),0 0 0 1px color-mix(in oklab,var(--brand,#fff) 35%,transparent),
    0 0 20px -6px color-mix(in oklab,var(--brand,#fff) 55%,transparent);
  transition:transform .18s cubic-bezier(.2,.7,.3,1);overflow:hidden;
}
.orn:hover .badge{transform:scale(1.12)}
.orn:focus-visible .badge{outline:2px solid var(--accent);outline-offset:3px}
.orn .badge img{width:68%;height:68%;object-fit:contain;display:block}
.orn .label{
  position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  font-family:var(--font-mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  text-shadow:0 1px 8px var(--bg-0);
}
.orn:hover .label{opacity:1}
@media (max-width:560px){
  .orn .badge{width:38px;height:38px;border-radius:11px}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dot{box-shadow:none}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.172.0/build/three.module.js",

<body>
<canvas id="c"></canvas>
<div class="hud" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>

<div class="chrome">
  <header class="top">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>kidand<span class="cat">cat</span></a>
    <span>under the sakura</span>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle color theme" aria-pressed="false">

      <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>

    <nav class="links" aria-label="Elsewhere">
      <a href="https://github.com/kidandcat" target="_blank" rel="me noopener noreferrer">github</a>
      <a href="https://x.com/kidandcat" target="_blank" rel="me noopener noreferrer">x</a>
    </nav>
  </footer>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

/* ============================================================
   3D living sakura — Three.js
   Recursive tapered branches + instanced blossom canopy.
   ============================================================ */

const TOOLS = [
  { name: "Hyperframes", href: "https://hyperframes.heygen.com/", icon: "icons/hyperframes.png", brand: "#A78BFA", bg: "#14101f" },
  { name: "Impeccable",  href: "https://impeccable.style/",       icon: "icons/impeccable.png",  brand: "#C9A227", bg: "#111111" },
  { name: "Claude",      href: "https://claude.ai/code",          icon: "icons/claude.png",      brand: "#D97757", bg: "#2a1810" },
  { name: "Grok",        href: "https://grok.x.ai/",              icon: "icons/grok.png",        brand: "#E8E8E8", bg: "#0a0a0a" },
  { name: "Takan",       href: "https://takan.es",                icon: "icons/takan.png",       brand: "#6C5CE7", bg: "#14102a" },
  { name: "shot",        href: "https://github.com/kidandcat/shot", icon: "icons/shot.png",      brand: "#F0F6FC", bg: "#0d1117" },
  { name: "Flutter",     href: "https://flutter.dev",             icon: "icons/flutter.png",     brand: "#45D1FD", bg: "#042a3a" },
  { name: "Go",          href: "https://go.dev",                  icon: "icons/go.png",          brand: "#00ADD8", bg: "#06222b" },
  { name: "Rust",        href: "https://www.rust-lang.org",       icon: "icons/rust.png",        brand: "#DEA584", bg: "#1a120c" },
  { name: "Tailscale",   href: "https://tailscale.com",           icon: "icons/tailscale.png",   brand: "#8B93A7", bg: "#111318" }
];

const root = document.documentElement;
const KEY = "kac-theme";
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

function applyTheme(t){
  root.setAttribute("data-theme", t);
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "dark" ? "#05060c" : "#eef1f7");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.setAttribute("aria-pressed", String(t === "light"));
  applySceneTheme(t === "light");
}
let saved; try{ saved = localStorage.getItem(KEY); }catch(e){}
const initialLight = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem(KEY, next); }catch(e){}
});

/* ---------- RNG ---------- */
let seed = 20260731;
function rand(){
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let n = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  n = (n + Math.imul(n ^ (n >>> 7), 61 | n)) ^ n;
  return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
}
function rrange(a, b){ return a + rand() * (b - a); }

/* ---------- Scene ---------- */
const canvas = document.getElementById("c");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
} catch (err) {
  document.body.insertAdjacentHTML("beforeend",
    '<p style="position:fixed;inset:0;display:grid;place-items:center;color:#eef1fb;font:14px/1.5 system-ui;padding:24px;text-align:center;z-index:20">WebGL is required for this page.</p>');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.id = "labels";
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.inset = "0";
// Labels must not block orbit; tools re-enable clicks on themselves
labelRenderer.domElement.style.pointerEvents = "none";
labelRenderer.domElement.style.zIndex = "2";
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(1.0, 3.2, 18);

// Bind orbit to the WebGL canvas (not the no-events label overlay)
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableRotate = true;
controls.enablePan = false;
controls.enableZoom = true;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.9;
controls.minDistance = 9;
controls.maxDistance = 40;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.5;
controls.target.set(0, 1.4, 0);
controls.autoRotate = !reduce.matches;
controls.autoRotateSpeed = 0.35;
// pause auto-spin while dragging; resume after a while of idle
let idleTimer = 0;
controls.addEventListener("start", () => {
  controls.autoRotate = false;
  idleTimer = 0;
});
controls.addEventListener("end", () => {
  idleTimer = 0;
});

/* Lights */
const hemi = new THREE.HemisphereLight(0xc8d4ff, 0x3a2218, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2e8, 1.25);
sun.position.set(5, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -2;
sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffa0c8, 0.55);
rim.position.set(-6, 4, -5);
scene.add(rim);
const fill = new THREE.PointLight(0xffb8d8, 0.55, 24, 2);
fill.position.set(0, 3.5, 3);
scene.add(fill);
const bounce = new THREE.PointLight(0xffc0d8, 0.25, 18, 2);
bounce.position.set(-2, 1.5, 2);
scene.add(bounce);

/* Ground */
const groundGeo = new THREE.CircleGeometry(9, 48);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0a0c14, roughness: 0.95, metalness: 0.05, transparent: true, opacity: 0.85
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* Soft fog */
scene.fog = new THREE.FogExp2(0x0a0c17, 0.028);

function applySceneTheme(light){
  if(light){
    scene.fog.color.set(0xe8ecf6);
    scene.fog.density = 0.018;
    groundMat.color.set(0xd8dce8);
    hemi.color.set(0xe8f0ff); hemi.groundColor.set(0xc8a090); hemi.intensity = 0.75;
    sun.intensity = 1.0; sun.color.set(0xfff8f0);
    rim.intensity = 0.3;
    renderer.setClearColor(0x000000, 0);
    document.body.style.background = "";
  } else {
    scene.fog.color.set(0x0a0c17);
    scene.fog.density = 0.028;
    groundMat.color.set(0x0a0c14);
    hemi.color.set(0xb8c8ff); hemi.groundColor.set(0x2a1a18); hemi.intensity = 0.55;
    sun.intensity = 1.15; sun.color.set(0xfff0e0);
    rim.intensity = 0.45;
  }
}

/* ---------- Materials ---------- */
const barkMat = new THREE.MeshStandardMaterial({
  color: 0x3d2a22, roughness: 0.92, metalness: 0.02
});
const barkDarkMat = new THREE.MeshStandardMaterial({
  color: 0x2a1c16, roughness: 0.94, metalness: 0.02
});
const barkLiteMat = new THREE.MeshStandardMaterial({
  color: 0x5a4034, roughness: 0.9, metalness: 0.02
});

/* Soft painted sakura texture (looks far better than hard star geometry) */
function makeSakuraTexture(){
  const size = 128;
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const g = c.getContext("2d");
  const cx = size / 2, cy = size / 2;

  // transparent clear
  g.clearRect(0, 0, size, size);

  // 5 soft rounded petals with tip notch
  for(let i = 0; i < 5; i++){
    const ang = (i / 5) * Math.PI * 2 - Math.PI / 2;
    g.save();
    g.translate(cx, cy);
    g.rotate(ang);
    // petal body
    const grad = g.createRadialGradient(0, size * 0.18, 2, 0, size * 0.16, size * 0.22);
    grad.addColorStop(0, "rgba(255,230,240,0.98)");
    grad.addColorStop(0.45, "rgba(255,170,200,0.92)");
    grad.addColorStop(0.85, "rgba(240,120,165,0.55)");
    grad.addColorStop(1, "rgba(220,90,140,0)");
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, size * 0.02);
    g.bezierCurveTo(size * 0.12, size * 0.06, size * 0.14, size * 0.2, size * 0.06, size * 0.28);
    // notch
    g.quadraticCurveTo(size * 0.02, size * 0.24, 0, size * 0.26);
    g.quadraticCurveTo(-size * 0.02, size * 0.24, -size * 0.06, size * 0.28);
    g.bezierCurveTo(-size * 0.14, size * 0.2, -size * 0.12, size * 0.06, 0, size * 0.02);
    g.fill();
    g.restore();
  }
  // yellow-green center
  const cg = g.createRadialGradient(cx, cy, 0, cx, cy, size * 0.06);
  cg.addColorStop(0, "rgba(255,230,120,0.95)");
  cg.addColorStop(0.6, "rgba(255,190,80,0.7)");
  cg.addColorStop(1, "rgba(255,160,60,0)");
  g.fillStyle = cg;
  g.beginPath();
  g.arc(cx, cy, size * 0.055, 0, Math.PI * 2);
  g.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makePetalTexture(){
  const size = 64;
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const g = c.getContext("2d");
  g.clearRect(0, 0, size, size);
  g.translate(size / 2, size / 2);
  const grad = g.createRadialGradient(0, size * 0.05, 1, 0, 0, size * 0.4);
  grad.addColorStop(0, "rgba(255,220,235,0.95)");
  grad.addColorStop(0.5, "rgba(255,160,195,0.9)");
  grad.addColorStop(1, "rgba(240,100,150,0)");
  g.fillStyle = grad;
  g.beginPath();
  g.moveTo(0, -size * 0.32);
  g.bezierCurveTo(size * 0.22, -size * 0.1, size * 0.18, size * 0.2, 0, size * 0.35);
  g.bezierCurveTo(-size * 0.18, size * 0.2, -size * 0.22, -size * 0.1, 0, -size * 0.32);
  g.fill();
  // notch
  g.globalCompositeOperation = "destination-out";
  g.beginPath();
  g.moveTo(0, -size * 0.32);
  g.lineTo(size * 0.04, -size * 0.2);
  g.lineTo(0, -size * 0.24);
  g.lineTo(-size * 0.04, -size * 0.2);
  g.closePath();
  g.fill();
  g.globalCompositeOperation = "source-over";
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const sakuraTex = makeSakuraTexture();
const petalTex = makePetalTexture();

const flowerMat = new THREE.MeshBasicMaterial({
  map: sakuraTex,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  alphaTest: 0.08
});
const flowerMatDeep = flowerMat.clone();
flowerMatDeep.color = new THREE.Color(0xffd0e4);
const flowerMatLite = flowerMat.clone();
flowerMatLite.color = new THREE.Color(0xffffff);
const FLOWER_MATS = [flowerMat, flowerMatDeep, flowerMatLite];

// Simple quad for textured blossom (billboard-ish, rotated freely)
const FLOWER_GEO = new THREE.PlaneGeometry(0.28, 0.28);

/* ---------- Tree build ---------- */
const treeRoot = new THREE.Group();
scene.add(treeRoot);

const branchGroups = [];
const hangAnchors = [];
const tipJoints = [];
const flowerClusters = [];

const dummy = new THREE.Object3D();
const _up = new THREE.Vector3(0, 1, 0);
const _yAxis = new THREE.Vector3(0, 1, 0);

function addBranchMesh(parent, from, to, radiusBottom, radiusTop, radial = 8){
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  if(len < 0.01) return null;
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, len, radial);
  geo.translate(0, len / 2, 0);
  // subtle bark shade by thickness
  const mat = radiusBottom > 0.14 ? barkDarkMat : (radiusBottom > 0.07 ? barkMat : barkLiteMat);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(from);
  mesh.quaternion.setFromUnitVectors(_up, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

/** Fibonacci sphere offsets for natural cluster density */
function fibSphere(i, n, radius){
  const y = 1 - (i / Math.max(1, n - 1)) * 2;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = Math.PI * (3 - Math.sqrt(5)) * i;
  return new THREE.Vector3(
    Math.cos(theta) * r * radius,
    y * radius * 0.75,
    Math.sin(theta) * r * radius
  );
}

function addFlowerCluster(joint, count, spread){
  const mat = FLOWER_MATS[(rand() * 3) | 0];
  const mesh = new THREE.InstancedMesh(FLOWER_GEO, mat, count);
  mesh.frustumCulled = true;
  mesh.renderOrder = 2;
  for(let i = 0; i < count; i++){
    const off = fibSphere(i, count, spread);
    // slight noise
    off.x += rrange(-spread * 0.12, spread * 0.12);
    off.y += rrange(-spread * 0.08, spread * 0.15);
    off.z += rrange(-spread * 0.12, spread * 0.12);
    dummy.position.copy(off);
    const s = rrange(0.75, 1.35);
    dummy.scale.setScalar(s);
    // mostly face outward from tip center
    dummy.lookAt(off.x * 2, off.y * 2 + 0.2, off.z * 2);
    dummy.rotateZ(rrange(0, Math.PI * 2));
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  joint.add(mesh);
  flowerClusters.push(mesh);
}

/**
 * Controlled sakura skeleton:
 * short thick trunk → wide primary fan → secondary/tertiary with droop.
 * Flowers only on outer joints so canopy follows wood.
 */
function growBranch(parentGroup, origin, direction, length, radius, depth, maxDepth){
  direction = direction.clone().normalize();
  // sakura outer limbs weep slightly
  if(depth >= 3){
    direction.y -= 0.12 + (depth - 3) * 0.04;
    direction.normalize();
  }

  // curved segment: mid control point for organic bend
  const mid = origin.clone().addScaledVector(direction, length * 0.5);
  // lateral curve
  const side = new THREE.Vector3().crossVectors(direction, _yAxis);
  if(side.lengthSq() < 1e-6) side.set(1, 0, 0);
  side.normalize();
  mid.addScaledVector(side, rrange(-0.08, 0.08) * length);
  mid.y += rrange(-0.03, 0.05) * length;

  const end = origin.clone().addScaledVector(direction, length);
  // two-cylinder chain for slight curve
  addBranchMesh(parentGroup, origin, mid, radius, radius * 0.78, depth < 2 ? 10 : 7);
  addBranchMesh(parentGroup, mid, end, radius * 0.78, radius * 0.58, depth < 2 ? 9 : 6);

  const joint = new THREE.Group();
  joint.position.copy(end);
  parentGroup.add(joint);
  joint.userData = {
    phase: rrange(0, Math.PI * 2),
    flex: 0.01 + depth * 0.009,
    depth
  };
  branchGroups.push(joint);

  const isTip = depth >= maxDepth || length < 0.2;

  // blossoms on outer wood (depth 3+)
  if(depth >= 3 && !isTip && rand() < 0.65){
    addFlowerCluster(joint, 4 + (rand() * 5 | 0), 0.12 + depth * 0.01);
  }

  if(isTip){
    tipJoints.push(joint);
    // dense tip puff — main canopy volume
    const n = 14 + (rand() * 16 | 0);
    addFlowerCluster(joint, n, 0.22 + rand() * 0.08);
    if(depth >= 3 && rand() < 0.5){
      hangAnchors.push({ group: joint, local: new THREE.Vector3(0, -0.14, 0), score: 0 });
    }
    return joint;
  }

  // child count by depth — wider at crown split
  let childCount;
  if(depth === 0) childCount = 6;
  else if(depth === 1) childCount = 4;
  else if(depth === 2) childCount = 3;
  else if(depth === 3) childCount = rand() < 0.7 ? 3 : 2;
  else childCount = rand() < 0.5 ? 2 : 1;

  for(let c = 0; c < childCount; c++){
    let childDir;
    if(depth === 0){
      // wide horizontal sakura fan (broader than tall)
      const a = (c / childCount) * Math.PI * 1.85 - Math.PI * 0.925;
      const elev = 0.38 + rrange(0, 0.32);
      childDir = new THREE.Vector3(
        Math.sin(a) * (0.95 + rrange(-0.08, 0.08)),
        elev,
        Math.cos(a) * (0.65 + rrange(-0.1, 0.12))
      ).normalize();
    } else {
      const axis = new THREE.Vector3(rrange(-1, 1), rrange(0.1, 1), rrange(-1, 1)).normalize();
      const spread = rrange(0.35, 0.85) * (c % 2 === 0 ? 1 : -1);
      childDir = direction.clone()
        .applyAxisAngle(axis, spread)
        .add(new THREE.Vector3(0, rrange(-0.25, 0.4), 0))
        .normalize();
    }

    // length: keep canopy wide; don't shoot sky-high
    let lenMul = depth === 0 ? rrange(0.72, 0.88)
      : depth === 1 ? rrange(0.65, 0.8)
      : depth === 2 ? rrange(0.58, 0.72)
      : rrange(0.55, 0.7);
    // outer limbs longer horizontally
    if(depth === 0 && Math.abs(childDir.x) > 0.5) lenMul *= 1.08;

    const childLen = length * lenMul;
    const childRad = radius * rrange(0.52, 0.64);
    growBranch(joint, new THREE.Vector3(0, 0, 0), childDir, childLen, childRad, depth + 1, maxDepth);
  }

  // side spur for denser silhouette
  if(depth >= 1 && depth <= 3 && rand() < 0.45){
    const spurDir = direction.clone()
      .applyAxisAngle(new THREE.Vector3(0, 1, 0), rrange(-1.3, 1.3))
      .add(new THREE.Vector3(0, rrange(-0.4, 0.1), 0))
      .normalize();
    growBranch(joint, new THREE.Vector3(0, 0, 0), spurDir, length * rrange(0.32, 0.48), radius * 0.42, depth + 2, maxDepth);
  }

  return joint;
}

function buildTree(){
  while(treeRoot.children.length) treeRoot.remove(treeRoot.children[0]);
  branchGroups.length = 0;
  hangAnchors.length = 0;
  tipJoints.length = 0;
  flowerClusters.length = 0;
  seed = 20260731;

  const mobile = window.innerWidth < 720;
  const maxDepth = mobile ? 5 : 6;

  const trunkGroup = new THREE.Group();
  treeRoot.add(trunkGroup);

  // Multi-segment trunk with gentle S-curve
  const trunkR = mobile ? 0.17 : 0.22;
  const segments = [
    { y: 0.0,  r: trunkR * 1.9 },
    { y: 0.35, r: trunkR * 1.45 },
    { y: 0.85, r: trunkR * 1.15 },
    { y: 1.35, r: trunkR * 0.95 },
    { y: 1.85, r: trunkR * 0.82 },
    { y: mobile ? 2.05 : 2.25, r: trunkR * 0.72 }
  ];
  // slight lean
  let px = 0, pz = 0;
  for(let i = 0; i < segments.length - 1; i++){
    const a = segments[i];
    const b = segments[i + 1];
    const lean = 0.04 * Math.sin(i * 0.9);
    const from = new THREE.Vector3(px, a.y, pz);
    px += lean;
    pz += lean * 0.4;
    const to = new THREE.Vector3(px, b.y, pz);
    addBranchMesh(trunkGroup, from, to, a.r, b.r, 12);
  }

  // Root flare disc-ish base
  const baseGeo = new THREE.CylinderGeometry(trunkR * 2.0, trunkR * 2.6, 0.28, 14);
  const base = new THREE.Mesh(baseGeo, barkDarkMat);
  base.position.y = 0.1;
  base.castShadow = true;
  base.receiveShadow = true;
  trunkGroup.add(base);

  const trunkTop = new THREE.Vector3(px, segments[segments.length - 1].y, pz);
  const trunkTopJoint = new THREE.Group();
  trunkTopJoint.position.copy(trunkTop);
  trunkGroup.add(trunkTopJoint);
  trunkTopJoint.userData = { phase: 0.2, flex: 0.006, depth: 0 };
  branchGroups.push(trunkTopJoint);

  // Primary limbs from trunk top — wide sakura fan
  const primN = mobile ? 5 : 6;
  const trunkLen = segments[segments.length - 1].y;
  for(let c = 0; c < primN; c++){
    const a = (c / primN) * Math.PI * 1.9 - Math.PI * 0.95;
    const elev = 0.32 + rrange(0.05, 0.28);
    const dir = new THREE.Vector3(
      Math.sin(a) * 1.0,
      elev,
      Math.cos(a) * 0.7 + rrange(-0.08, 0.08)
    ).normalize();
    const len = trunkLen * rrange(0.85, 1.05);
    const rad = trunkR * rrange(0.48, 0.58);
    growBranch(trunkTopJoint, new THREE.Vector3(0, 0, 0), dir, len, rad, 1, maxDepth);
  }
  // one upward leader for crown height
  growBranch(
    trunkTopJoint,
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(rrange(-0.15, 0.15), 1, rrange(-0.15, 0.15)).normalize(),
    trunkLen * 0.55,
    trunkR * 0.42,
    1,
    maxDepth
  );

  treeRoot.updateMatrixWorld(true);

  for(const h of hangAnchors){
    const wp = new THREE.Vector3();
    h.group.getWorldPosition(wp);
    // Prefer mid-lower outer tips for tools (readable under canopy edge)
    h.score = (4.5 - Math.abs(wp.y - 2.2)) + Math.hypot(wp.x, wp.z) * 0.4;
  }

  placeTools();
  fitCameraToTree();
}

/** Fit full tree with healthy margin on all aspect ratios */
function fitCameraToTree(){
  treeRoot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(treeRoot);
  if(box.isEmpty()) return;
  // Expand box slightly for flower billboards
  box.expandByScalar(0.35);

  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  // Look at mid-trunk so base + crown share the frame
  const target = new THREE.Vector3(center.x, Math.max(1.1, center.y * 0.48), center.z);
  controls.target.copy(target);

  const aspect = camera.aspect || 1;
  const fovY = camera.fov * (Math.PI / 180);
  const fovX = 2 * Math.atan(Math.tan(fovY / 2) * aspect);
  // Distance needed for height and width
  const distH = (size.y * 0.55) / Math.tan(fovY / 2);
  const distW = (size.x * 0.55) / Math.tan(fovX / 2);
  let dist = Math.max(distH, distW) * 1.35; // margin
  // ultrawide short windows need more distance
  if(aspect > 1.8) dist *= 1.12;
  if(aspect < 0.85) dist *= 1.2;
  dist = Math.max(14, Math.min(dist, controls.maxDistance * 0.92));

  const dir = new THREE.Vector3(0.22, 0.28, 1).normalize();
  camera.position.copy(target).addScaledVector(dir, dist);
  camera.near = 0.1;
  camera.far = Math.max(100, dist * 5);
  camera.updateProjectionMatrix();
  controls.update();
}

/* Falling sakura petals */
const PETAL_N = 100;
const petalGeo = new THREE.PlaneGeometry(0.12, 0.16);
const petalMat = new THREE.MeshBasicMaterial({
  map: petalTex,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  alphaTest: 0.1
});
const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, PETAL_N);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petalMesh.renderOrder = 3;
scene.add(petalMesh);
const petals = [];
for(let i = 0; i < PETAL_N; i++){
  petals.push({
    x: 0, y: -10, z: 0,
    vx: 0, vy: 0, vz: 0,
    rot: 0, vrot: 0,
    phase: rrange(0, Math.PI * 2), amp: rrange(0.15, 0.5),
    alive: false
  });
}

/* Tools as CSS2D — blossomed tips only */
const toolObjects = [];
function placeTools(){
  toolObjects.forEach(o => {
    if(o.parent) o.parent.remove(o);
    o.element?.remove();
  });
  toolObjects.length = 0;

  hangAnchors.sort((a, b) => b.score - a.score);
  const chosen = [];
  const minD = 0.9;
  for(const h of hangAnchors){
    if(chosen.length >= TOOLS.length) break;
    const wp = new THREE.Vector3();
    h.group.getWorldPosition(wp);
    let ok = true;
    for(const c of chosen){
      if(wp.distanceTo(c.wp) < minD){ ok = false; break; }
    }
    if(ok && wp.y > 1.0 && wp.y < 4.5) chosen.push({ ...h, wp });
  }
  if(chosen.length < TOOLS.length){
    for(const j of tipJoints){
      if(chosen.length >= TOOLS.length) break;
      const wp = new THREE.Vector3();
      j.getWorldPosition(wp);
      let ok = true;
      for(const c of chosen){
        if(wp.distanceTo(c.wp) < minD){ ok = false; break; }
      }
      if(ok && wp.y > 1.15 && wp.y < 4.2){
        chosen.push({ group: j, local: new THREE.Vector3(0, -0.14, 0), wp });
      }
    }
  }

  for(let t = 0; t < TOOLS.length && t < chosen.length; t++){
    const tool = TOOLS[t];
    const anchor = chosen[t];
    const el = document.createElement("a");
    el.className = "orn";
    el.href = tool.href;
    el.target = "_blank";
    el.rel = "noopener noreferrer";
    el.title = tool.name;
    el.innerHTML = `<span class="knot" aria-hidden="true"></span><span class="badge"><img alt="" width="32" height="32" decoding="async" src="${tool.icon}"></span><span class="label"></span>`;
    el.style.setProperty("--brand", tool.brand);
    el.querySelector(".badge").style.background = tool.bg;
    el.querySelector(".label").textContent = tool.name;

    const obj = new CSS2DObject(el);
    obj.position.copy(anchor.local || new THREE.Vector3(0, -0.14, 0));
    obj.userData = { phase: t * 0.8, drop: 0.1 + (t % 3) * 0.035 };
    anchor.group.add(obj);
    toolObjects.push(obj);
  }
}

/* ---------- Animation ---------- */
const clock = new THREE.Clock();
let windGust = 0.12;
let windTarget = 0.12;
let windT = 0;

function animateBranches(t){
  windT -= 0.016;
  if(windT <= 0){
    windTarget = rrange(0.04, 0.28);
    windT = rrange(2.5, 5.5);
  }
  windGust += (windTarget - windGust) * 0.018;
  const breeze = Math.sin(t * 0.55) * 0.35 + Math.sin(t * 0.19) * 0.2 + windGust;

  for(const g of branchGroups){
    const d = g.userData;
    if(!d || d.depth < 1) continue;
    // gentler on thick wood, freer at tips
    const amp = d.flex * (0.15 + d.depth * 0.28) * breeze;
    g.rotation.x = Math.sin(t * 0.95 + d.phase) * amp;
    g.rotation.z = Math.cos(t * 0.8 + d.phase * 1.2) * amp * 0.65;
  }
}

function animatePetals(dt, t){
  for(let i = 0; i < PETAL_N; i++){
    const p = petals[i];
    if(!p.alive){
      if(Math.random() < 0.015){
        p.alive = true;
        if(tipJoints.length){
          const j = tipJoints[(Math.random() * tipJoints.length) | 0];
          const wp = new THREE.Vector3();
          j.getWorldPosition(wp);
          p.x = wp.x + rrange(-0.3, 0.3);
          p.y = wp.y + rrange(-0.05, 0.25);
          p.z = wp.z + rrange(-0.3, 0.3);
        } else {
          p.x = rrange(-2.5, 2.5);
          p.y = rrange(3, 5);
          p.z = rrange(-2.5, 2.5);
        }
        p.vy = rrange(-0.38, -0.12);
        p.vx = rrange(-0.18, 0.18);
        p.vz = rrange(-0.18, 0.18);
        p.rot = rrange(0, Math.PI * 2);
        p.vrot = rrange(-2, 2);
        p.amp = rrange(0.2, 0.55);
      } else {
        dummy.position.set(0, -20, 0);
        dummy.scale.setScalar(0);
        dummy.updateMatrix();
        petalMesh.setMatrixAt(i, dummy.matrix);
        continue;
      }
    }
    p.vy -= 0.12 * dt;
    p.vx += Math.sin(t + p.phase) * 0.025 * dt;
    p.x += (p.vx + Math.sin(t * 1.4 + p.phase) * p.amp * 0.35) * dt;
    p.y += p.vy * dt;
    p.z += (p.vz + Math.cos(t * 1.1 + p.phase) * p.amp * 0.3) * dt;
    p.rot += p.vrot * dt;
    if(p.y < 0.02) p.alive = false;
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rot * 0.6, p.rot, p.rot * 0.4);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
}

function animateTools(t){
  for(const o of toolObjects){
    const u = o.userData;
    const sway = Math.sin(t * 1.1 + u.phase) * 0.07 * (0.4 + windGust);
    o.position.x = Math.sin(sway) * u.drop;
    o.position.y = -0.14 - Math.abs(Math.cos(sway)) * 0.02;
  }
}

function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  labelRenderer.setSize(w, h);
  fitCameraToTree();
}
window.addEventListener("resize", onResize);

window.addEventListener("pointerdown", (e) => {
  if(e.target.closest && e.target.closest("a,button")) return;
  windTarget = 0.55;
  windT = 1.8;
});

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  if(!reduce.matches){
    animateBranches(t);
    animatePetals(dt, t);
    animateTools(t);
    // resume gentle auto-orbit after ~6s idle
    idleTimer += dt;
    if(idleTimer > 6 && !controls.autoRotate && !reduce.matches){
      controls.autoRotate = true;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// init
applyTheme(initialLight ? "light" : "dark");
buildTree();
frame();
</script>

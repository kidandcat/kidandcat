<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080f">
<meta name="description" content="kidandcat — a living sakura tree of tools.">
<title>kidandcat</title>
<style>
:root{
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg-0:#05060c; --bg-1:#0a0c17; --sky-top:#070a18; --sky-mid:#161028; --glow-warm:#3a1a24;
  --ink:#eef1fb; --ink-dim:#9aa2be; --ink-faint:#5a627e;
  --line-strong:rgba(150,175,255,0.30);
  --accent:#57e6ff; --accent-3:#ff6ea9;
  --panel:rgba(12,16,32,0.55); --panel-brd:rgba(120,150,230,0.22);
  --string:rgba(255,210,230,0.5); --glow-a:rgba(87,230,255,0.45);
  --badge-ring:rgba(255,255,255,0.14); --badge-shadow:0 10px 28px -8px rgba(0,0,0,.65);
}
html[data-theme="light"]{
  --bg-0:#e8ecf6; --bg-1:#f3f5fb; --sky-top:#e6eefb; --sky-mid:#f6e8ef; --glow-warm:#ffe4cc;
  --ink:#161a26; --ink-dim:#4c5470; --ink-faint:#8b93ac;
  --line-strong:rgba(40,60,130,0.22);
  --accent:#0a97b8; --accent-3:#d24f86;
  --panel:rgba(255,255,255,0.72); --panel-brd:rgba(40,60,130,0.14);
  --string:rgba(120,60,80,0.4); --glow-a:rgba(10,151,184,0.3);
  --badge-ring:rgba(0,0,0,0.08); --badge-shadow:0 12px 28px -12px rgba(30,45,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100svh; min-height:100dvh;
  font-family:var(--font-sans); color:var(--ink);
  background:var(--bg-1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .5s ease, color .5s ease;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .sky{
  position:absolute;inset:-8%;
  background:
    radial-gradient(100% 70% at 55% 18%, var(--sky-mid) 0%, transparent 58%),
    radial-gradient(80% 55% at 20% 100%, var(--glow-warm) 0%, transparent 55%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
}
.bg .aura{position:absolute;inset:0;mix-blend-mode:screen;opacity:.8}
html[data-theme="light"] .bg .aura{mix-blend-mode:multiply;opacity:.4}
.bg .aura b{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 30s ease-in-out infinite alternate}
@media (max-width:820px){.bg .aura b{animation:none;filter:blur(48px)}}
.bg .aura .a1{width:46vmax;height:46vmax;left:42%;top:-18%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.11}
.bg .aura .a2{width:38vmax;height:38vmax;left:-12%;top:48%;background:radial-gradient(circle,#ffb570 0%,transparent 62%);opacity:.11;animation-delay:-10s}
.bg .aura .a3{width:34vmax;height:34vmax;left:60%;top:50%;background:radial-gradient(circle,var(--accent-3) 0%,transparent 62%);opacity:.12;animation-delay:-16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(2.5%,-2%,0) scale(1.08)}}

#tree{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
.ground{
  position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, transparent 0%, color-mix(in oklab, var(--bg-0) 50%, transparent) 65%, var(--bg-0) 100%);
  opacity:.9;
}
.hud{position:fixed;inset:0;z-index:6;pointer-events:none}
.hud .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--line-strong)}
.hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
.hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
.hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
.hud .br{bottom:14px;right:14px;border-left:0;border-top:0}

.chrome{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(14px,2vw,22px);
}
.chrome a,.chrome button{pointer-events:auto}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:800;letter-spacing:-0.02em;font-size:clamp(1rem,2vw,1.15rem);text-transform:none;
}
.brand .cat{
  background:linear-gradient(180deg, var(--accent-3) 0%, color-mix(in oklab, var(--accent) 50%, var(--accent-3)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-a);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-a)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.toggle{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border:1px solid var(--panel-brd);
  padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
}
.toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle svg{width:14px;height:14px;display:block}
.toggle .ti-sun{display:none}
html[data-theme="light"] .toggle .ti-sun{display:block}
html[data-theme="light"] .toggle .ti-moon{display:none}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.links{display:flex;gap:14px}
.links a{color:var(--ink-dim);text-decoration:none}
.links a:hover{color:var(--ink)}

#ornaments{position:fixed;inset:0;z-index:3;pointer-events:none}
.orn{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;text-decoration:none;color:inherit}
.orn::before{
  content:"";position:absolute;left:50%;top:-26px;width:1px;height:26px;
  background:linear-gradient(180deg, transparent, var(--string));transform:translateX(-50%);
}
.orn .knot{
  position:absolute;left:50%;top:-4px;width:6px;height:6px;border-radius:50%;
  background:color-mix(in oklab, #6b3f2a 70%, var(--accent-3));transform:translateX(-50%);
}
.orn .badge{
  width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:var(--badge-bg,#111);border:1.5px solid var(--badge-ring);
  box-shadow:var(--badge-shadow),0 0 0 1px color-mix(in oklab,var(--brand,#fff) 35%,transparent),
    0 0 20px -6px color-mix(in oklab,var(--brand,#fff) 55%,transparent);
  transition:transform .18s cubic-bezier(.2,.7,.3,1);overflow:hidden;
}
.orn:hover .badge{transform:scale(1.1)}
.orn:focus-visible .badge{outline:2px solid var(--accent);outline-offset:3px}
.orn .badge img{width:68%;height:68%;object-fit:contain;display:block}
.orn .label{
  position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);
  font-family:var(--font-mono);font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  text-shadow:0 1px 8px var(--bg-0);
}
.orn:hover .label{opacity:1}
@media (max-width:560px){
  .orn .badge{width:38px;height:38px;border-radius:11px}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dot{box-shadow:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="aura"><b class="a1"></b><b class="a2"></b><b class="a3"></b></div>
</div>
<canvas id="tree" aria-hidden="true"></canvas>
<div class="ground" aria-hidden="true"></div>
<div id="ornaments" aria-label="Tools hanging from the tree"></div>
<div class="hud" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
</div>
<div class="chrome">
  <header class="top">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>kidand<span class="cat">cat</span></a>
    <span>under the sakura</span>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle color theme" aria-pressed="false">
      <svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      <span>theme</span>
    </button>
  </header>
  <footer class="foot">
    <span class="hint">/// click for a breeze · tools hang from the branches</span>
    <nav class="links" aria-label="Elsewhere">
      <a href="https://github.com/kidandcat" target="_blank" rel="me noopener noreferrer">github</a>
      <a href="https://x.com/kidandcat" target="_blank" rel="me noopener noreferrer">x</a>
    </nav>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     2D sakura — fast & pretty
     - Pre-baked flower + petal sprites (drawImage only)
     - Thick trunk + few primary arms (simple structure)
     - Dense tip clusters for canopy mass
     - Falling petals (classic feel)
     - DOM tool badges on outer limbs
     ============================================================ */

  var root = document.documentElement;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var KEY = "kac-theme";

  function applyTheme(t) {
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", t === "dark" ? "#05060c" : "#eef1f7");
    var btn = document.getElementById("themeBtn");
    if (btn) btn.setAttribute("aria-pressed", String(t === "light"));
  }
  var saved;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    buildSprites(next === "light");
  });

  var TOOLS = [
    { name: "Hyperframes", href: "https://hyperframes.heygen.com/", icon: "icons/hyperframes.png", brand: "#A78BFA", bg: "#14101f" },
    { name: "Impeccable",  href: "https://impeccable.style/",       icon: "icons/impeccable.png",  brand: "#C9A227", bg: "#111111" },
    { name: "Claude",      href: "https://claude.ai/code",          icon: "icons/claude.png",      brand: "#D97757", bg: "#2a1810" },
    { name: "Grok",        href: "https://grok.x.ai/",              icon: "icons/grok.png",        brand: "#E8E8E8", bg: "#0a0a0a" },
    { name: "Takan",       href: "https://takan.es",                icon: "icons/takan.png",       brand: "#6C5CE7", bg: "#14102a" },
    { name: "shot",        href: "https://github.com/kidandcat/shot", icon: "icons/shot.png",      brand: "#F0F6FC", bg: "#0d1117" },
    { name: "Flutter",     href: "https://flutter.dev",             icon: "icons/flutter.png",     brand: "#45D1FD", bg: "#042a3a" },
    { name: "Go",          href: "https://go.dev",                  icon: "icons/go.png",          brand: "#00ADD8", bg: "#06222b" },
    { name: "Rust",        href: "https://www.rust-lang.org",       icon: "icons/rust.png",        brand: "#DEA584", bg: "#1a120c" },
    { name: "Tailscale",   href: "https://tailscale.com",           icon: "icons/tailscale.png",   brand: "#8B93A7", bg: "#111318" }
  ];

  var canvas = document.getElementById("tree");
  var ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  var W = 0, H = 0, DPR = 1;
  var t0 = performance.now();
  var mouse = { x: 0.5, y: 0.4, tx: 0.5, ty: 0.4 };
  var wind = { v: 0.1, target: 0.1, t: 120 };
  var limbs = [];
  var blooms = [];
  var hangPts = [];
  var ornaments = [];
  var petals = [];
  var flowerSprites = [];
  var petalSprite = null;
  var bark = null;
  var baseX = 0, baseY = 0, trunkW = 28;
  var running = false, raf = null;
  var seed = 20260731;
  var MAX_PETALS = 55;
  var MOUSE_R = 140;

  function rand() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var n = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    n = (n + Math.imul(n ^ (n >>> 7), 61 | n)) ^ n;
    return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
  }
  function rrange(a, b) { return a + rand() * (b - a); }
  function isLight() { return root.getAttribute("data-theme") === "light"; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---- Pre-bake sakura flower (rounded notched petals) ---- */
  function paintFlower(g, size, light) {
    var cx = size / 2, cy = size / 2;
    g.clearRect(0, 0, size, size);
    for (var i = 0; i < 5; i++) {
      var ang = (i / 5) * Math.PI * 2 - Math.PI / 2;
      g.save();
      g.translate(cx, cy);
      g.rotate(ang);
      var grad = g.createRadialGradient(0, size * 0.16, 1, 0, size * 0.14, size * 0.22);
      if (light) {
        grad.addColorStop(0, "rgba(255,235,242,0.98)");
        grad.addColorStop(0.4, "rgba(255,175,205,0.9)");
        grad.addColorStop(0.8, "rgba(245,130,175,0.45)");
        grad.addColorStop(1, "rgba(230,100,150,0)");
      } else {
        grad.addColorStop(0, "rgba(255,220,235,0.96)");
        grad.addColorStop(0.4, "rgba(255,155,195,0.88)");
        grad.addColorStop(0.8, "rgba(235,100,155,0.4)");
        grad.addColorStop(1, "rgba(200,70,120,0)");
      }
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(0, size * 0.02);
      g.bezierCurveTo(size * 0.11, size * 0.05, size * 0.13, size * 0.18, size * 0.055, size * 0.26);
      g.quadraticCurveTo(size * 0.02, size * 0.22, 0, size * 0.24);
      g.quadraticCurveTo(-size * 0.02, size * 0.22, -size * 0.055, size * 0.26);
      g.bezierCurveTo(-size * 0.13, size * 0.18, -size * 0.11, size * 0.05, 0, size * 0.02);
      g.fill();
      g.restore();
    }
    var cg = g.createRadialGradient(cx, cy, 0, cx, cy, size * 0.055);
    cg.addColorStop(0, light ? "rgba(255,230,130,0.95)" : "rgba(255,210,100,0.9)");
    cg.addColorStop(0.7, light ? "rgba(255,190,80,0.55)" : "rgba(255,170,60,0.5)");
    cg.addColorStop(1, "rgba(255,160,40,0)");
    g.fillStyle = cg;
    g.beginPath();
    g.arc(cx, cy, size * 0.05, 0, Math.PI * 2);
    g.fill();
  }

  function paintPetal(g, size, light) {
    g.clearRect(0, 0, size, size);
    g.translate(size / 2, size / 2);
    var grad = g.createRadialGradient(0, size * 0.04, 1, 0, 0, size * 0.38);
    if (light) {
      grad.addColorStop(0, "rgba(255,225,235,0.95)");
      grad.addColorStop(0.5, "rgba(245,150,185,0.88)");
      grad.addColorStop(1, "rgba(230,100,150,0)");
    } else {
      grad.addColorStop(0, "rgba(255,210,225,0.95)");
      grad.addColorStop(0.5, "rgba(255,145,185,0.85)");
      grad.addColorStop(1, "rgba(220,90,140,0)");
    }
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(0, -size * 0.3);
    g.bezierCurveTo(size * 0.2, -size * 0.08, size * 0.16, size * 0.18, 0, size * 0.32);
    g.bezierCurveTo(-size * 0.16, size * 0.18, -size * 0.2, -size * 0.08, 0, -size * 0.3);
    g.fill();
    // tip notch
    g.globalCompositeOperation = "destination-out";
    g.beginPath();
    g.moveTo(0, -size * 0.3);
    g.lineTo(size * 0.035, -size * 0.18);
    g.lineTo(0, -size * 0.22);
    g.lineTo(-size * 0.035, -size * 0.18);
    g.closePath();
    g.fill();
    g.globalCompositeOperation = "source-over";
    g.setTransform(1, 0, 0, 1, 0, 0);
  }

  function buildSprites(light) {
    flowerSprites = [];
    // a few size variants baked once
    for (var v = 0; v < 4; v++) {
      var size = 64 + v * 8;
      var c = document.createElement("canvas");
      c.width = size; c.height = size;
      paintFlower(c.getContext("2d"), size, light);
      flowerSprites.push(c);
    }
    petalSprite = document.createElement("canvas");
    petalSprite.width = 32; petalSprite.height = 32;
    paintPetal(petalSprite.getContext("2d"), 32, light);

    bark = light
      ? ["#4a2e24", "#5c3a2c", "#6e4838", "rgba(120,78,62,0.88)"]
      : ["#2c1c18", "#3a2620", "#4a322c", "rgba(88,60,54,0.9)"];
  }

  /* ---- Tree: thick trunk + wide primary arms + tip blooms ---- */
  function buildTree() {
    limbs = []; blooms = []; hangPts = [];
    seed = 20260731;

    var mobile = W < 720;
    var S = Math.min(W, H);
    baseX = W * 0.5;
    baseY = H * 0.92;
    trunkW = S * (mobile ? 0.036 : 0.04);

    // Fit tree into view with margin
    var trunkH = S * (mobile ? 0.32 : 0.34);
    var trunkTopY = baseY - trunkH;

    // Trunk polyline (gentle curve)
    limbs.push({
      pts: [
        { x: baseX, y: baseY },
        { x: baseX + S * 0.014, y: baseY - trunkH * 0.35 },
        { x: baseX - S * 0.01, y: baseY - trunkH * 0.68 },
        { x: baseX + S * 0.004, y: trunkTopY }
      ],
      width: trunkW,
      depth: 0,
      phase: 0.15
    });

    // Primary arms — wide sakura fan
    var arms = [
      { ang: -2.7,  len: 0.28, w: 0.72, bend: -0.38 },
      { ang: -2.3,  len: 0.32, w: 0.8,  bend: -0.22 },
      { ang: -1.9,  len: 0.3,  w: 0.86, bend: -0.08 },
      { ang: -1.55, len: 0.31, w: 0.9,  bend: 0.05 },
      { ang: -1.2,  len: 0.33, w: 0.9,  bend: 0.08 },
      { ang: -0.85, len: 0.3,  w: 0.86, bend: 0.15 },
      { ang: -0.45, len: 0.32, w: 0.8,  bend: 0.25 },
      { ang: -0.05, len: 0.28, w: 0.72, bend: 0.38 }
    ];
    if (mobile) arms = [arms[1], arms[2], arms[3], arms[4], arms[5], arms[6]];

    var fork = { x: baseX, y: trunkTopY };

    for (var i = 0; i < arms.length; i++) {
      var a = arms[i];
      var len = S * a.len;
      var ang = a.ang + rrange(-0.04, 0.04);
      var midAng = ang + a.bend * 0.45;
      var tipAng = ang + a.bend;
      var p0 = { x: fork.x, y: fork.y };
      var p1 = {
        x: fork.x + Math.cos(midAng) * len * 0.5 + rrange(-S * 0.006, S * 0.006),
        y: fork.y + Math.sin(midAng) * len * 0.5 + rrange(-S * 0.006, S * 0.006)
      };
      var p2 = {
        x: fork.x + Math.cos(tipAng) * len,
        y: fork.y + Math.sin(tipAng) * len
      };

      limbs.push({
        pts: [p0, p1, p2],
        width: trunkW * a.w,
        depth: 1,
        phase: rrange(0, Math.PI * 2),
        tipX: p2.x, tipY: p2.y,
        midX: p1.x, midY: p1.y
      });

      // one secondary per arm
      var side = i % 2 === 0 ? -1 : 1;
      var sang = tipAng + side * rrange(0.4, 0.7);
      var slen = len * rrange(0.34, 0.48);
      var sp0 = { x: lerp(p1.x, p2.x, 0.42), y: lerp(p1.y, p2.y, 0.42) };
      var sp1 = {
        x: sp0.x + Math.cos(sang) * slen * 0.5,
        y: sp0.y + Math.sin(sang) * slen * 0.5
      };
      var sp2 = {
        x: sp0.x + Math.cos(sang + side * 0.12) * slen,
        y: sp0.y + Math.sin(sang + side * 0.12) * slen
      };
      limbs.push({
        pts: [sp0, sp1, sp2],
        width: trunkW * a.w * 0.48,
        depth: 2,
        phase: rrange(0, Math.PI * 2),
        tipX: sp2.x, tipY: sp2.y
      });

      // dense bloom clusters on tips (canopy mass)
      addBloomCluster(p2.x, p2.y, S * rrange(0.09, 0.13), 22 + (rand() * 14 | 0));
      addBloomCluster(sp2.x, sp2.y, S * rrange(0.07, 0.1), 16 + (rand() * 10 | 0));
      // mid-outer fill
      addBloomCluster(lerp(p1.x, p2.x, 0.65), lerp(p1.y, p2.y, 0.65), S * rrange(0.06, 0.09), 12 + (rand() * 8 | 0));
      addBloomCluster(lerp(p1.x, p2.x, 0.85), lerp(p1.y, p2.y, 0.85) - S * 0.02, S * rrange(0.05, 0.08), 10 + (rand() * 6 | 0));

      // hang under outer arms
      hangPts.push({
        x: lerp(p1.x, p2.x, 0.55),
        y: lerp(p1.y, p2.y, 0.55) + S * 0.02,
        score: Math.abs(p2.x - baseX) + p2.y * 0.25
      });
      hangPts.push({
        x: p1.x,
        y: p1.y + S * 0.015,
        score: Math.abs(p1.x - baseX) * 0.85 + p1.y * 0.3
      });
    }

    // upper crown fill so canopy isn't hollow
    var crownCX = baseX;
    var crownCY = trunkTopY - S * 0.1;
    var nFill = mobile ? 20 : 32;
    for (var f = 0; f < nFill; f++) {
      var fa = (f / nFill) * Math.PI * 2 + rrange(-0.12, 0.12);
      var fd = S * rrange(0.03, 0.22);
      addBloomCluster(
        crownCX + Math.cos(fa) * fd * 1.2,
        crownCY + Math.sin(fa) * fd * 0.7,
        S * rrange(0.06, 0.1),
        12 + (rand() * 10 | 0)
      );
    }
    // rim
    var nRim = mobile ? 14 : 20;
    for (var r = 0; r < nRim; r++) {
      var ra = -Math.PI * 0.05 - (r / (nRim - 1)) * Math.PI * 0.9;
      addBloomCluster(
        crownCX + Math.cos(ra) * S * 0.32,
        crownCY + Math.sin(ra) * S * 0.24,
        S * rrange(0.065, 0.1),
        12 + (rand() * 8 | 0)
      );
    }

    assignOrnaments();
  }

  function addBloomCluster(x, y, spread, n) {
    for (var i = 0; i < n; i++) {
      // golden-angle scatter for natural packing
      var t = i * 2.399;
      var rad = spread * Math.sqrt((i + 0.5) / n);
      blooms.push({
        x: x + Math.cos(t) * rad,
        y: y + Math.sin(t) * rad * 0.85,
        rx: x + Math.cos(t) * rad,
        ry: y + Math.sin(t) * rad * 0.85,
        r: rrange(14, 28),
        sprite: (rand() * flowerSprites.length) | 0,
        phase: rrange(0, Math.PI * 2),
        flex: rrange(0.008, 0.018),
        rot: rrange(0, Math.PI * 2)
      });
    }
  }

  function assignOrnaments() {
    var host = document.getElementById("ornaments");
    host.innerHTML = "";
    ornaments = [];
    hangPts.sort(function (a, b) { return b.score - a.score; });

    var chosen = [];
    var minD = Math.max(64, W * 0.06);
    for (var i = 0; i < hangPts.length && chosen.length < TOOLS.length; i++) {
      var hp = hangPts[i];
      if (hp.y < H * 0.2 || hp.y > H * 0.72) continue;
      var ok = true;
      for (var j = 0; j < chosen.length; j++) {
        var dx = hp.x - chosen[j].x, dy = hp.y - chosen[j].y;
        if (dx * dx + dy * dy < minD * minD) { ok = false; break; }
      }
      if (ok) chosen.push(hp);
    }
    // pad from bloom centers if needed
    if (chosen.length < TOOLS.length) {
      for (var b = 0; b < blooms.length && chosen.length < TOOLS.length; b += 7) {
        var bl = blooms[b];
        if (bl.ry < H * 0.25 || bl.ry > H * 0.68) continue;
        var ok2 = true;
        for (var k = 0; k < chosen.length; k++) {
          var dx2 = bl.rx - chosen[k].x, dy2 = bl.ry - chosen[k].y;
          if (dx2 * dx2 + dy2 * dy2 < minD * minD) { ok2 = false; break; }
        }
        if (ok2) chosen.push({ x: bl.rx, y: bl.ry + 18, score: 0 });
      }
    }

    for (var t = 0; t < TOOLS.length && t < chosen.length; t++) {
      var tool = TOOLS[t];
      var pt = chosen[t];
      var a = document.createElement("a");
      a.className = "orn";
      a.href = tool.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = tool.name;
      a.innerHTML = '<span class="knot" aria-hidden="true"></span><span class="badge"><img alt="" width="32" height="32" decoding="async"></span><span class="label"></span>';
      a.style.setProperty("--brand", tool.brand);
      a.querySelector(".badge").style.background = tool.bg;
      var img = a.querySelector("img");
      img.src = tool.icon;
      img.alt = tool.name;
      a.querySelector(".label").textContent = tool.name;
      host.appendChild(a);
      ornaments.push({
        el: a,
        rx: pt.x, ry: pt.y,
        x: pt.x, y: pt.y,
        swing: 0, swingV: 0,
        drop: 22 + (t % 4) * 7,
        phase: t * 0.7
      });
    }
  }

  /* ---- Animate ---- */
  function animate(time) {
    var breeze = Math.sin(time * 0.55) * 0.4 + Math.sin(time * 0.2) * 0.2 + wind.v * 0.55;
    var curX = mouse.x * W, curY = mouse.y * H;
    var r2 = MOUSE_R * MOUSE_R;

    for (var i = 0; i < blooms.length; i++) {
      var bl = blooms[i];
      var sway = (breeze + Math.sin(time * 0.9 + bl.phase) * 0.35) * bl.flex * 28;
      var mx = 0, my = 0;
      var dx = bl.rx - curX, dy = bl.ry - curY;
      var d2 = dx * dx + dy * dy;
      if (d2 < r2) {
        var fall = 1 - d2 / r2;
        fall *= fall;
        mx = fall * 5 * (dx > 0 ? 0.25 : -0.25);
        my = fall * Math.sin(time * 2 + bl.phase) * 2.5;
      }
      bl.x = bl.rx + sway + mx;
      bl.y = bl.ry + Math.sin(time * 0.7 + bl.phase) * bl.flex * 10 + my;
    }

    for (var o = 0; o < ornaments.length; o++) {
      var orn = ornaments[o];
      orn.x = orn.rx + Math.sin(time * 0.55 + orn.phase) * 1.8;
      orn.y = orn.ry + Math.sin(time * 0.45 + orn.phase) * 1;
    }
  }

  /* ---- Draw ---- */
  function drawLimb(limb, time) {
    var pts = limb.pts;
    if (pts.length < 2) return;
    var breathe = limb.depth > 0 ? Math.sin(time * 0.55 + limb.phase) * 1.2 : 0;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = limb.depth === 0 ? bark[0] : limb.depth === 1 ? bark[1] : bark[2];
    ctx.lineWidth = limb.width;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x + breathe, pts[1].y);
    } else {
      for (var i = 1; i < pts.length - 1; i++) {
        var xc = (pts[i].x + pts[i + 1].x) / 2;
        var yc = (pts[i].y + pts[i + 1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
      }
      var last = pts[pts.length - 1];
      ctx.quadraticCurveTo(last.x, last.y, last.x + breathe * 0.25, last.y);
    }
    ctx.stroke();

    if (limb.depth < 2) {
      ctx.strokeStyle = isLight() ? "rgba(140,95,70,0.28)" : "rgba(110,80,60,0.22)";
      ctx.lineWidth = Math.max(1.2, limb.width * 0.2);
      ctx.beginPath();
      ctx.moveTo(pts[0].x - limb.width * 0.1, pts[0].y);
      if (pts.length >= 3) {
        ctx.quadraticCurveTo(
          pts[1].x - limb.width * 0.08, pts[1].y,
          pts[2].x - limb.width * 0.05, pts[2].y
        );
      }
      ctx.stroke();
    }
  }

  function drawTrunkBase() {
    var w = trunkW * 1.5;
    ctx.fillStyle = bark[0];
    ctx.beginPath();
    ctx.moveTo(baseX - w * 0.5, baseY - trunkW * 1.6);
    ctx.quadraticCurveTo(baseX - w * 1.05, baseY + 2, baseX - w * 0.28, baseY + 3);
    ctx.lineTo(baseX + w * 0.28, baseY + 3);
    ctx.quadraticCurveTo(baseX + w * 1.05, baseY + 2, baseX + w * 0.5, baseY - trunkW * 1.6);
    ctx.closePath();
    ctx.fill();
  }

  function draw(time) {
    ctx.clearRect(0, 0, W, H);

    // ground shadow
    ctx.fillStyle = isLight() ? "rgba(40,30,50,0.1)" : "rgba(0,0,0,0.38)";
    ctx.beginPath();
    ctx.ellipse(baseX, baseY + 2, trunkW * 3.0, trunkW * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // wood under canopy
    drawTrunkBase();
    for (var d = 0; d <= 2; d++) {
      for (var i = 0; i < limbs.length; i++) {
        if (limbs[i].depth === d) drawLimb(limbs[i], time);
      }
    }

    // blossoms — only drawImage (cheap)
    if (!flowerSprites.length) return;
    for (var b = 0; b < blooms.length; b++) {
      var bl = blooms[b];
      var spr = flowerSprites[bl.sprite];
      var sz = bl.r * (1 + Math.sin(time * 0.65 + bl.phase) * 0.02);
      ctx.save();
      ctx.translate(bl.x, bl.y);
      ctx.rotate(bl.rot + Math.sin(time * 0.3 + bl.phase) * 0.04);
      ctx.drawImage(spr, -sz * 0.5, -sz * 0.5, sz, sz);
      ctx.restore();
    }
  }

  /* ---- Falling petals (original vibe) ---- */
  function spawnPetal() {
    if (petals.length >= MAX_PETALS || !blooms.length) return;
    var bl = blooms[(Math.random() * blooms.length) | 0];
    petals.push({
      x: bl.x + rrange(-8, 8),
      y: bl.y + rrange(-4, 6),
      size: 4 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.07,
      vy: 0.35 + Math.random() * 0.95,
      vx: wind.v * 0.4 + (Math.random() - 0.35) * 0.55,
      amp: 12 + Math.random() * 28,
      ph: Math.random() * Math.PI * 2,
      phs: 0.01 + Math.random() * 0.02,
      a: 0
    });
  }

  function drawPetals(dt) {
    if (!reduce.matches) {
      var rate = 0.5 + Math.abs(wind.v) * 0.9;
      if (Math.random() < rate * dt * 0.07) spawnPetal();
    }
    if (!petalSprite) return;
    for (var i = petals.length - 1; i >= 0; i--) {
      var p = petals[i];
      p.vy += 0.0035 * dt;
      p.vx += wind.v * 0.012 * dt;
      p.vx *= 0.995;
      p.x += (p.vx + Math.sin(p.ph) * 0.16) * dt;
      p.y += p.vy * dt;
      p.ph += p.phs * dt;
      p.rot += p.vrot * dt;
      if (p.a < 0.9) p.a += 0.04 * dt;
      if (p.y > H * 0.9) p.a -= 0.035 * dt;
      if (p.y > H + 20 || p.a <= 0 || p.x < -40 || p.x > W + 40) {
        petals.splice(i, 1);
        continue;
      }
      var xx = p.x + Math.sin(p.ph) * p.amp;
      var s = p.size * 2.3;
      ctx.globalAlpha = p.a;
      ctx.save();
      ctx.translate(xx, p.y);
      ctx.rotate(p.rot + Math.sin(p.ph) * 0.35);
      ctx.drawImage(petalSprite, -s * 0.5, -s * 0.5, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function updateOrnaments(time, dt) {
    for (var i = 0; i < ornaments.length; i++) {
      var o = ornaments[i];
      var target = wind.v * 0.05 + Math.sin(time * 1.05 + o.phase) * 0.04;
      o.swingV += (target - o.swing) * 0.06 * dt;
      o.swingV *= Math.pow(0.92, dt);
      o.swing += o.swingV * dt;
      var ang = o.swing;
      var tx = o.x + Math.sin(ang) * o.drop;
      var ty = o.y + Math.cos(ang) * o.drop;
      o.el.style.transform =
        "translate(" + (tx | 0) + "px," + (ty | 0) + "px) rotate(" + (ang * 14).toFixed(2) + "deg) translate(-50%,0)";
    }
  }

  function updateWind(dt) {
    wind.t -= dt;
    if (wind.t <= 0) {
      wind.target = (Math.random() - 0.4) * 0.55;
      wind.t = (2.5 + Math.random() * 5) * 60;
    }
    wind.v += (wind.target - wind.v) * 0.014 * dt;
  }

  var last = performance.now();
  var themeWatch = root.getAttribute("data-theme");

  function frame(now) {
    if (!running) return;
    var dt = Math.min(2.5, (now - last) / 16.666);
    last = now;
    var time = (now - t0) / 1000;

    var th = root.getAttribute("data-theme");
    if (th !== themeWatch) {
      themeWatch = th;
      buildSprites(th === "light");
    }

    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    if (!reduce.matches) {
      updateWind(dt);
      animate(time);
      draw(time);
      drawPetals(dt);
      updateOrnaments(time, dt);
    } else {
      for (var i = 0; i < blooms.length; i++) {
        blooms[i].x = blooms[i].rx;
        blooms[i].y = blooms[i].ry;
      }
      draw(0);
      updateOrnaments(0, 1);
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (running) return;
    running = true;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "low";
    petals = [];
    buildSprites(isLight());
    buildTree();
  }

  window.addEventListener("resize", (function () {
    var z;
    return function () { clearTimeout(z); z = setTimeout(resize, 120); };
  })(), { passive: true });

  window.addEventListener("pointermove", function (e) {
    mouse.tx = e.clientX / window.innerWidth;
    mouse.ty = e.clientY / window.innerHeight;
  }, { passive: true });

  window.addEventListener("pointerdown", function (e) {
    if (e.target.closest && e.target.closest("a,button")) return;
    wind.target = (e.clientX / W - 0.5) * 1.2;
    wind.t = 2 * 60;
    for (var i = 0; i < 10; i++) spawnPetal();
  }, { passive: true });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else start();
  });
  if (reduce.addEventListener) {
    reduce.addEventListener("change", function () { if (!reduce.matches) start(); });
  }

  resize();
  start();
})();
</script>
</body>
</html>

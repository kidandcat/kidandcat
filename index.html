<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080f">
<meta name="description" content="kidandcat — a living sakura tree of tools.">
<title>kidandcat</title>
<style>
:root{
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg-0:#05060c; --bg-1:#0a0c17; --sky-top:#070a18; --sky-mid:#161028; --glow-warm:#3a1a24;
  --ink:#eef1fb; --ink-dim:#9aa2be; --ink-faint:#5a627e;
  --line-strong:rgba(150,175,255,0.30);
  --accent:#57e6ff; --accent-3:#ff6ea9;
  --panel:rgba(12,16,32,0.55); --panel-brd:rgba(120,150,230,0.22);
  --string:rgba(255,210,230,0.5); --glow-a:rgba(87,230,255,0.45);
  --badge-ring:rgba(255,255,255,0.14); --badge-shadow:0 10px 28px -8px rgba(0,0,0,.65);
}
html[data-theme="light"]{
  --bg-0:#e8ecf6; --bg-1:#f3f5fb; --sky-top:#e6eefb; --sky-mid:#f6e8ef; --glow-warm:#ffe4cc;
  --ink:#161a26; --ink-dim:#4c5470; --ink-faint:#8b93ac;
  --line-strong:rgba(40,60,130,0.22);
  --accent:#0a97b8; --accent-3:#d24f86;
  --panel:rgba(255,255,255,0.7); --panel-brd:rgba(40,60,130,0.14);
  --string:rgba(120,60,80,0.4); --glow-a:rgba(10,151,184,0.3);
  --badge-ring:rgba(0,0,0,0.08); --badge-shadow:0 12px 28px -12px rgba(30,45,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100svh; min-height:100dvh;
  font-family:var(--font-sans); color:var(--ink);
  background:var(--bg-1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .6s ease, color .6s ease;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .sky{
  position:absolute;inset:-8%;
  background:
    radial-gradient(100% 70% at 55% 20%, var(--sky-mid) 0%, transparent 58%),
    radial-gradient(80% 55% at 20% 100%, var(--glow-warm) 0%, transparent 55%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
}
.bg .aura{position:absolute;inset:0;mix-blend-mode:screen;opacity:.85}
html[data-theme="light"] .bg .aura{mix-blend-mode:multiply;opacity:.45}
.bg .aura b{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 28s ease-in-out infinite alternate}
@media (max-width:820px){.bg .aura b{animation:none;filter:blur(50px)}}
.bg .aura .a1{width:48vmax;height:48vmax;left:40%;top:-20%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.12}
.bg .aura .a2{width:40vmax;height:40vmax;left:-14%;top:50%;background:radial-gradient(circle,#ffb570 0%,transparent 62%);opacity:.12;animation-delay:-10s}
.bg .aura .a3{width:36vmax;height:36vmax;left:62%;top:52%;background:radial-gradient(circle,var(--accent-3) 0%,transparent 62%);opacity:.14;animation-delay:-16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,-2.5%,0) scale(1.1)}}

#tree{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
.ground{
  position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, transparent 0%, color-mix(in oklab, var(--bg-0) 55%, transparent) 70%, var(--bg-0) 100%);
  opacity:.85;
}
.hud{position:fixed;inset:0;z-index:6;pointer-events:none}
.hud .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--line-strong)}
.hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
.hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
.hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
.hud .br{bottom:14px;right:14px;border-left:0;border-top:0}

.chrome{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(14px,2vw,22px);
}
.chrome a,.chrome button{pointer-events:auto}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:800;letter-spacing:-0.02em;font-size:clamp(1rem,2vw,1.15rem);text-transform:none;
}
.brand .cat{
  background:linear-gradient(180deg, var(--accent-3) 0%, color-mix(in oklab, var(--accent) 50%, var(--accent-3)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-a);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-a)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.toggle{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border:1px solid var(--panel-brd);
  padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
}
.toggle:hover{color:var(--ink);border-color:var(--line-strong)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle svg{width:14px;height:14px;display:block}
.toggle .ti-sun{display:none}
html[data-theme="light"] .toggle .ti-sun{display:block}
html[data-theme="light"] .toggle .ti-moon{display:none}
.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.links{display:flex;gap:14px}
.links a{color:var(--ink-dim);text-decoration:none}
.links a:hover{color:var(--ink)}

#ornaments{position:fixed;inset:0;z-index:3;pointer-events:none}
.orn{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform;text-decoration:none;color:inherit}
.orn::before{
  content:"";position:absolute;left:50%;top:-28px;width:1px;height:28px;
  background:linear-gradient(180deg, transparent, var(--string));transform:translateX(-50%);
}
.orn .knot{
  position:absolute;left:50%;top:-4px;width:6px;height:6px;border-radius:50%;
  background:color-mix(in oklab, #6b3f2a 70%, var(--accent-3));transform:translateX(-50%);
}
.orn .badge{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:var(--badge-bg,#111);border:1.5px solid var(--badge-ring);
  box-shadow:var(--badge-shadow),0 0 0 1px color-mix(in oklab,var(--brand,#fff) 35%,transparent),
    0 0 22px -6px color-mix(in oklab,var(--brand,#fff) 55%,transparent);
  transition:transform .18s cubic-bezier(.2,.7,.3,1);overflow:hidden;
}
.orn:hover .badge{transform:scale(1.1)}
.orn:focus-visible .badge{outline:2px solid var(--accent);outline-offset:3px}
.orn .badge img{width:70%;height:70%;object-fit:contain;display:block}
.orn .label{
  position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);
  font-family:var(--font-mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
  text-shadow:0 1px 8px var(--bg-0);
}
.orn:hover .label{opacity:1}
@media (max-width:560px){
  .orn .badge{width:40px;height:40px;border-radius:12px}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dot{box-shadow:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="aura"><b class="a1"></b><b class="a2"></b><b class="a3"></b></div>
</div>
<canvas id="tree" aria-hidden="true"></canvas>
<div class="ground" aria-hidden="true"></div>
<div id="ornaments" aria-label="Tools hanging from the tree"></div>
<div class="hud" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
</div>
<div class="chrome">
  <header class="top">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>kidand<span class="cat">cat</span></a>
    <span>under the sakura</span>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle color theme" aria-pressed="false">
      <svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      <span>theme</span>
    </button>
  </header>
  <footer class="foot">
    <span class="hint">/// click for a breeze · tools hang from the branches</span>
    <nav class="links" aria-label="Elsewhere">
      <a href="https://github.com/kidandcat" target="_blank" rel="me noopener noreferrer">github</a>
      <a href="https://x.com/kidandcat" target="_blank" rel="me noopener noreferrer">x</a>
    </nav>
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     Dense cartoon / watercolor sakura
     Structure = thick trunk + few primary arms.
     Canopy = solid soft pink masses (not stick + confetti).
     Refs: vecteezy mass canopy · pinterest cloud foliage.
     ============================================================ */

  var root = document.documentElement;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var KEY = "kac-theme";
  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#05060c" : "#eef1f7");
    var btn = document.getElementById("themeBtn");
    if(btn) btn.setAttribute("aria-pressed", String(t === "light"));
  }
  var saved; try{ saved = localStorage.getItem(KEY); }catch(e){}
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  document.getElementById("themeBtn").addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY, next); }catch(e){}
    buildCanopySprite(next === "light");
  });

  var TOOLS = [
    { name: "Hyperframes", href: "https://hyperframes.heygen.com/", icon: "icons/hyperframes.png", brand: "#A78BFA", bg: "#14101f" },
    { name: "Impeccable",  href: "https://impeccable.style/",       icon: "icons/impeccable.png",  brand: "#C9A227", bg: "#111111" },
    { name: "Claude",      href: "https://claude.ai/code",          icon: "icons/claude.png",      brand: "#D97757", bg: "#2a1810" },
    { name: "Grok",        href: "https://grok.x.ai/",              icon: "icons/grok.png",        brand: "#E8E8E8", bg: "#0a0a0a" },
    { name: "Takan",       href: "https://takan.es",                icon: "icons/takan.png",       brand: "#6C5CE7", bg: "#14102a" },
    { name: "shot",        href: "https://github.com/kidandcat/shot", icon: "icons/shot.png",      brand: "#F0F6FC", bg: "#0d1117" },
    { name: "Flutter",     href: "https://flutter.dev",             icon: "icons/flutter.png",     brand: "#45D1FD", bg: "#042a3a" },
    { name: "Go",          href: "https://go.dev",                  icon: "icons/go.png",          brand: "#00ADD8", bg: "#06222b" },
    { name: "Rust",        href: "https://www.rust-lang.org",       icon: "icons/rust.png",        brand: "#DEA584", bg: "#1a120c" },
    { name: "Tailscale",   href: "https://tailscale.com",           icon: "icons/tailscale.png",   brand: "#8B93A7", bg: "#111318" }
  ];

  var canvas = document.getElementById("tree");
  var ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  var W = 0, H = 0, DPR = 1;
  var t0 = performance.now();
  var mouse = { x: 0.5, y: 0.4, tx: 0.5, ty: 0.4 };
  var wind = { v: 0.06, target: 0.06, t: 0 };
  var limbs = [];      // thick wood polylines
  var clouds = [];     // canopy masses
  var hangPts = [];
  var ornaments = [];
  var petals = [];
  var canopySprite = null; // pre-baked soft pink cloud
  var petalSprite = null;
  var baseX = 0, baseY = 0;
  var trunkW = 28;
  var running = false, raf = null;
  var seed = 20260731;
  var MAX_PETALS = 45;
  var MOUSE_R = 160;

  function rand(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var n = Math.imul(seed ^ seed >>> 15, 1 | seed);
    n = n + Math.imul(n ^ n >>> 7, 61 | n) ^ n;
    return ((n ^ n >>> 14) >>> 0) / 4294967296;
  }
  function rrange(a,b){ return a + rand() * (b - a); }
  function isLight(){ return root.getAttribute("data-theme") === "light"; }
  function lerp(a,b,t){ return a + (b-a)*t; }

  /* ---- Solid cartoon foliage lobe (opaque core, soft rim only) ---- */
  function buildCanopySprite(light){
    var size = 256;
    var c = document.createElement("canvas");
    c.width = size; c.height = size;
    var g = c.getContext("2d");
    var cx = size / 2, cy = size / 2;

    var pinkDeep = light ? "#e86a9a" : "#d45488";
    var pinkMid  = light ? "#f48ab4" : "#e878a8";
    var pinkLite = light ? "#ffb6d0" : "#f5a0c0";
    var pinkHi   = light ? "#ffd6e6" : "#ffc0d8";

    // Scalloped solid silhouette (cartoon cloud) — no transparent holes
    g.fillStyle = pinkMid;
    g.beginPath();
    var lobes = 8;
    for(var i = 0; i < lobes; i++){
      var ang = (i / lobes) * Math.PI * 2 - Math.PI / 2;
      var R = size * 0.30;
      var r = size * 0.175;
      var lx = cx + Math.cos(ang) * R;
      var ly = cy + Math.sin(ang) * R * 0.92;
      if(i === 0) g.moveTo(lx + r, ly);
      g.arc(lx, ly, r, 0, Math.PI * 2);
    }
    g.arc(cx, cy, size * 0.28, 0, Math.PI * 2);
    g.fill("evenodd"); // may cut holes — better use source-over fills instead
    // Fill properly: paint center + lobes solid
    g.globalCompositeOperation = "source-over";
    g.fillStyle = pinkMid;
    g.beginPath(); g.arc(cx, cy, size * 0.30, 0, Math.PI * 2); g.fill();
    for(var j = 0; j < lobes; j++){
      var a2 = (j / lobes) * Math.PI * 2 - Math.PI / 2 + 0.1;
      var R2 = size * 0.28;
      var r2 = size * 0.17;
      g.beginPath();
      g.arc(cx + Math.cos(a2) * R2, cy + Math.sin(a2) * R2 * 0.92, r2, 0, Math.PI * 2);
      g.fill();
    }

    // Depth: darker lower-right, lighter upper-left (solid shading, not bokeh)
    var shade = g.createLinearGradient(cx - size*0.2, cy - size*0.25, cx + size*0.25, cy + size*0.3);
    shade.addColorStop(0, pinkHi);
    shade.addColorStop(0.45, "rgba(0,0,0,0)");
    shade.addColorStop(1, pinkDeep);
    g.globalAlpha = 0.45;
    g.fillStyle = shade;
    g.beginPath(); g.arc(cx, cy, size * 0.42, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;

    // Soft only at outer rim (single feather ring)
    var rim = g.createRadialGradient(cx, cy, size * 0.34, cx, cy, size * 0.48);
    rim.addColorStop(0, "rgba(0,0,0,0)");
    rim.addColorStop(0.55, light ? "rgba(244,138,180,0.25)" : "rgba(212,84,136,0.22)");
    rim.addColorStop(1, "rgba(200,70,120,0)");
    g.fillStyle = rim;
    g.beginPath(); g.arc(cx, cy, size * 0.48, 0, Math.PI * 2); g.fill();

    // clip residual corners to circle-ish by destination-in soft mask
    // (keeps lobe soft without bubble rings)

    canopySprite = c;

    petalSprite = document.createElement("canvas");
    petalSprite.width = 28; petalSprite.height = 28;
    var p = petalSprite.getContext("2d");
    p.translate(14, 14);
    p.fillStyle = light ? "rgba(240,140,175,0.92)" : "rgba(255,160,195,0.9)";
    p.beginPath();
    p.moveTo(0, -9);
    p.bezierCurveTo(6, -5, 5, 5, 0, 9);
    p.bezierCurveTo(-5, 5, -6, -5, 0, -9);
    p.fill();
  }

  /* ---- Hand-authored thick skeleton (cartoon sakura) ---- */
  function buildTree(){
    limbs = []; clouds = []; hangPts = [];
    seed = 20260731;

    var mobile = W < 720;
    baseX = W * 0.52;
    baseY = H * 0.93;
    var S = Math.min(W, H); // scale unit
    trunkW = S * (mobile ? 0.038 : 0.042);

    // Trunk taller so arms read under the canopy (cartoon sakura pose)
    var trunkTopY = baseY - S * (mobile ? 0.34 : 0.38);
    var trunk = {
      pts: [
        { x: baseX, y: baseY },
        { x: baseX + S * 0.018, y: baseY - S * 0.14 },
        { x: baseX - S * 0.01, y: baseY - S * 0.26 },
        { x: baseX + S * 0.006, y: trunkTopY }
      ],
      width: trunkW,
      depth: 0,
      phase: 0.1
    };
    limbs.push(trunk);

    // Primary arms — thick, visible under pink mass (like ref cartoons)
    var arms = [
      { ang: -2.65, len: 0.30, w: 0.75, bend: -0.4,  clouds: 2 },
      { ang: -2.25, len: 0.34, w: 0.82, bend: -0.25, clouds: 3 },
      { ang: -1.85, len: 0.30, w: 0.88, bend: -0.08, clouds: 2 },
      { ang: -1.50, len: 0.32, w: 0.92, bend: 0.05,  clouds: 3 },
      { ang: -1.15, len: 0.34, w: 0.9,  bend: 0.08,  clouds: 3 },
      { ang: -0.80, len: 0.30, w: 0.88, bend: 0.12,  clouds: 2 },
      { ang: -0.40, len: 0.33, w: 0.8,  bend: 0.28,  clouds: 3 },
      { ang:  0.0,  len: 0.30, w: 0.72, bend: 0.4,   clouds: 2 }
    ];
    if(mobile){
      arms = [arms[1], arms[2], arms[3], arms[4], arms[5], arms[6]];
    }

    var fork = { x: baseX, y: trunkTopY };

    for(var i = 0; i < arms.length; i++){
      var a = arms[i];
      var len = S * a.len;
      var ang = a.ang + rrange(-0.05, 0.05);
      var midLen = len * 0.5;
      var midAng = ang + a.bend * 0.45;
      var tipAng = ang + a.bend;
      var p0 = { x: fork.x, y: fork.y };
      var p1 = {
        x: fork.x + Math.cos(midAng) * midLen + rrange(-S*0.008, S*0.008),
        y: fork.y + Math.sin(midAng) * midLen + rrange(-S*0.008, S*0.008)
      };
      var p2 = {
        x: fork.x + Math.cos(tipAng) * len,
        y: fork.y + Math.sin(tipAng) * len
      };

      var limb = {
        pts: [p0, p1, p2],
        width: trunkW * a.w,
        depth: 1,
        phase: rrange(0, Math.PI * 2),
        tipX: p2.x, tipY: p2.y,
        midX: p1.x, midY: p1.y
      };
      limbs.push(limb);

      // one thick secondary per arm (visible structure)
      var side = (i % 2 === 0) ? -1 : 1;
      var sang = tipAng + side * rrange(0.45, 0.75);
      var slen = len * rrange(0.32, 0.45);
      var sp0 = { x: lerp(p1.x, p2.x, 0.4), y: lerp(p1.y, p2.y, 0.4) };
      var sp1 = {
        x: sp0.x + Math.cos(sang) * slen * 0.5,
        y: sp0.y + Math.sin(sang) * slen * 0.5
      };
      var sp2 = {
        x: sp0.x + Math.cos(sang + side * 0.12) * slen,
        y: sp0.y + Math.sin(sang + side * 0.12) * slen
      };
      limbs.push({
        pts: [sp0, sp1, sp2],
        width: trunkW * a.w * 0.5,
        depth: 2,
        phase: rrange(0, Math.PI * 2),
        tipX: sp2.x, tipY: sp2.y,
        midX: sp1.x, midY: sp1.y
      });

      // outer tip lobe + one secondary (solid, large)
      addCloud(
        lerp(p1.x, p2.x, 0.85) + rrange(-S*0.02, S*0.02),
        lerp(p1.y, p2.y, 0.85) + rrange(-S*0.02, S*0.01),
        S * rrange(0.18, 0.26),
        rrange(0, Math.PI * 2)
      );
      if(a.clouds > 2){
        addCloud(
          lerp(p1.x, p2.x, 0.55),
          lerp(p1.y, p2.y, 0.55) - S * 0.02,
          S * rrange(0.14, 0.2),
          rrange(0, Math.PI * 2)
        );
      }
      addCloud(sp2.x, sp2.y, S * rrange(0.14, 0.2), rrange(0, Math.PI * 2));

      // hang under arms (tools sit below pink mass)
      hangPts.push({ x: p1.x, y: p1.y + S * 0.02, score: Math.abs(p1.x - baseX) + p1.y * 0.4 });
      hangPts.push({ x: lerp(p1.x, p2.x, 0.55), y: lerp(p1.y, p2.y, 0.55) + S * 0.03, score: Math.abs(p2.x - baseX) * 0.9 + p2.y * 0.35 });
    }

    // Upper crown — fewer larger solid lobes (reads as one pink mass)
    var crownCX = baseX;
    var crownCY = trunkTopY - S * 0.12;
    var nFill = mobile ? 6 : 9;
    for(var f = 0; f < nFill; f++){
      var fa = (f / nFill) * Math.PI * 2 + rrange(-0.2, 0.2);
      var fd = S * rrange(0.06, 0.18);
      addCloud(
        crownCX + Math.cos(fa) * fd * 1.15,
        crownCY + Math.sin(fa) * fd * 0.7 - S * 0.02,
        S * rrange(0.18, 0.28),
        rrange(0, Math.PI * 2)
      );
    }
    var nRim = mobile ? 8 : 11;
    for(var r = 0; r < nRim; r++){
      var ra = -Math.PI * 0.05 - (r / (nRim - 1)) * Math.PI * 0.9;
      var rx = crownCX + Math.cos(ra) * S * 0.34;
      var ry = crownCY + Math.sin(ra) * S * 0.25;
      addCloud(rx, ry, S * rrange(0.16, 0.24), rrange(0, Math.PI * 2));
    }

    assignOrnaments();
  }

  function addCloud(x, y, r, phase){
    clouds.push({
      x: x, y: y,
      rx: x, ry: y,   // rest
      r: r,
      phase: phase,
      flex: 0.012 + rand() * 0.01,
      // slight color/size variance when drawing
      scale: rrange(0.92, 1.08),
      rot: rrange(0, Math.PI * 2)
    });
  }

  function assignOrnaments(){
    var host = document.getElementById("ornaments");
    host.innerHTML = "";
    ornaments = [];
    hangPts.sort(function(a,b){ return b.score - a.score; });

    var chosen = [];
    var minD = Math.max(64, W * 0.06);
    for(var i = 0; i < hangPts.length && chosen.length < TOOLS.length; i++){
      var hp = hangPts[i];
      // prefer lower points (under canopy)
      if(hp.y < H * 0.22) continue;
      var ok = true;
      for(var j = 0; j < chosen.length; j++){
        var dx = hp.x - chosen[j].x, dy = hp.y - chosen[j].y;
        if(dx*dx + dy*dy < minD*minD){ ok = false; break; }
      }
      if(ok) chosen.push(hp);
    }
    // pad with cloud positions if needed
    if(chosen.length < TOOLS.length){
      for(var c = 0; c < clouds.length && chosen.length < TOOLS.length; c++){
        var cl = clouds[c];
        if(cl.ry < H * 0.25 || cl.ry > H * 0.7) continue;
        var ok2 = true;
        for(var k = 0; k < chosen.length; k++){
          var dx2 = cl.rx - chosen[k].x, dy2 = cl.ry - chosen[k].y;
          if(dx2*dx2 + dy2*dy2 < minD*minD){ ok2 = false; break; }
        }
        if(ok2) chosen.push({ x: cl.rx, y: cl.ry + cl.r * 0.35, limb: null });
      }
    }

    for(var t = 0; t < TOOLS.length && t < chosen.length; t++){
      var tool = TOOLS[t];
      var pt = chosen[t];
      var a = document.createElement("a");
      a.className = "orn";
      a.href = tool.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = tool.name;
      a.innerHTML = '<span class="knot" aria-hidden="true"></span><span class="badge"><img alt="" width="32" height="32" decoding="async"></span><span class="label"></span>';
      a.style.setProperty("--brand", tool.brand);
      a.querySelector(".badge").style.background = tool.bg;
      var img = a.querySelector("img");
      img.src = tool.icon; img.alt = tool.name;
      a.querySelector(".label").textContent = tool.name;
      host.appendChild(a);
      ornaments.push({
        el: a,
        x: pt.x, y: pt.y,
        rx: pt.x, ry: pt.y,
        swing: 0, swingV: 0,
        drop: 24 + (t % 4) * 8,
        phase: t * 0.7
      });
    }
  }

  /* ---- Animate: gentle cloud sway, almost still wood ---- */
  function animate(time){
    var breeze = Math.sin(time * 0.55) * 0.4 + Math.sin(time * 0.21) * 0.2 + wind.v * 0.6;
    var curX = mouse.x * W;
    var curY = mouse.y * H;
    var r2 = MOUSE_R * MOUSE_R;

    for(var i = 0; i < clouds.length; i++){
      var cl = clouds[i];
      var sway = (breeze + Math.sin(time * 0.9 + cl.phase) * 0.35) * cl.flex * 40;
      // mouse local
      var dx = cl.rx - curX, dy = cl.ry - curY;
      var d2 = dx*dx + dy*dy;
      var mx = 0, my = 0;
      if(d2 < r2){
        var fall = 1 - d2 / r2;
        fall *= fall;
        mx = fall * 6 * (dx > 0 ? 0.3 : -0.3);
        my = fall * Math.sin(time * 2 + cl.phase) * 3;
      }
      cl.x = cl.rx + sway + mx;
      cl.y = cl.ry + Math.sin(time * 0.7 + cl.phase) * cl.flex * 12 + my;
    }

    // ornaments follow rest hang + swing
    for(var o = 0; o < ornaments.length; o++){
      var orn = ornaments[o];
      // slight shared breeze
      orn.x = orn.rx + Math.sin(time * 0.6 + orn.phase) * 2;
      orn.y = orn.ry + Math.sin(time * 0.5 + orn.phase) * 1.2;
    }
  }

  /* ---- Draw ---- */
  function drawLimb(limb, time){
    var pts = limb.pts;
    if(pts.length < 2) return;
    // subtle breathe on tips only
    var breathe = limb.depth > 0 ? Math.sin(time * 0.6 + limb.phase) * 1.5 : 0;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // trunk/arms: gradient stroke via multiple passes
    var light = isLight();
    var baseCol = light ? "#5a3428" : "#3a241c";
    var hiCol = light ? "rgba(140,90,60,0.35)" : "rgba(100,70,55,0.3)";

    ctx.strokeStyle = baseCol;
    ctx.lineWidth = limb.width;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if(pts.length === 2){
      ctx.lineTo(pts[1].x + breathe, pts[1].y);
    } else {
      // smooth through mid
      for(var i = 1; i < pts.length - 1; i++){
        var xc = (pts[i].x + pts[i+1].x) / 2;
        var yc = (pts[i].y + pts[i+1].y) / 2;
        ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
      }
      var last = pts[pts.length - 1];
      ctx.quadraticCurveTo(last.x, last.y, last.x + breathe * 0.3, last.y);
    }
    ctx.stroke();

    // highlight edge for thickness read
    if(limb.depth < 2){
      ctx.strokeStyle = hiCol;
      ctx.lineWidth = Math.max(1.5, limb.width * 0.22);
      ctx.beginPath();
      ctx.moveTo(pts[0].x - limb.width * 0.12, pts[0].y);
      if(pts.length >= 3){
        ctx.quadraticCurveTo(
          pts[1].x - limb.width * 0.1, pts[1].y,
          pts[2].x - limb.width * 0.06, pts[2].y
        );
      } else {
        ctx.lineTo(pts[1].x, pts[1].y);
      }
      ctx.stroke();
    }
  }

  function drawTrunkBase(){
    // flared root at ground
    var light = isLight();
    var w = trunkW * 1.55;
    var g = ctx.createLinearGradient(baseX, baseY - trunkW * 2, baseX, baseY + 4);
    g.addColorStop(0, light ? "#5a3428" : "#3a241c");
    g.addColorStop(1, light ? "#4a2a20" : "#2a1814");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(baseX - w * 0.55, baseY - trunkW * 1.8);
    ctx.quadraticCurveTo(baseX - w * 1.1, baseY + 2, baseX - w * 0.3, baseY + 3);
    ctx.lineTo(baseX + w * 0.3, baseY + 3);
    ctx.quadraticCurveTo(baseX + w * 1.1, baseY + 2, baseX + w * 0.55, baseY - trunkW * 1.8);
    ctx.closePath();
    ctx.fill();
  }

  function draw(time){
    ctx.clearRect(0, 0, W, H);

    // ground shadow
    ctx.fillStyle = isLight() ? "rgba(40,30,50,0.12)" : "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(baseX, baseY + 2, trunkW * 3.2, trunkW * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    // wood first (under canopy)
    drawTrunkBase();
    // depth 0 then 1 then 2
    for(var d = 0; d <= 2; d++){
      for(var i = 0; i < limbs.length; i++){
        if(limbs[i].depth === d) drawLimb(limbs[i], time);
      }
    }

    // canopy — solid cartoon lobes
    if(canopySprite){
      for(var c = 0; c < clouds.length; c++){
        var cl = clouds[c];
        var sz = cl.r * 2.05 * cl.scale;
        sz *= 1 + Math.sin(time * 0.6 + cl.phase) * 0.01;
        ctx.save();
        ctx.translate(cl.x, cl.y);
        ctx.rotate(cl.rot + Math.sin(time * 0.25 + cl.phase) * 0.02);
        ctx.globalAlpha = 0.95;
        ctx.drawImage(canopySprite, -sz * 0.5, -sz * 0.5, sz, sz);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  function spawnPetal(){
    if(petals.length >= MAX_PETALS || !clouds.length) return;
    var cl = clouds[(Math.random() * clouds.length) | 0];
    // from lower rim of cloud
    var ang = rrange(0.2, Math.PI - 0.2);
    petals.push({
      x: cl.x + Math.cos(ang) * cl.r * 0.55,
      y: cl.y + Math.sin(ang) * cl.r * 0.45,
      size: 3.5 + Math.random() * 5.5,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.06,
      vy: 0.3 + Math.random() * 0.85,
      vx: wind.v * 0.35 + (Math.random() - 0.35) * 0.45,
      amp: 10 + Math.random() * 22,
      ph: Math.random() * Math.PI * 2,
      phs: 0.01 + Math.random() * 0.016,
      a: 0
    });
  }

  function drawPetals(dt){
    if(!reduce.matches && Math.random() < (0.4 + Math.abs(wind.v)) * dt * 0.06) spawnPetal();
    if(!petalSprite) return;
    for(var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.vy += 0.003 * dt;
      p.vx += wind.v * 0.01 * dt;
      p.vx *= 0.995;
      p.x += (p.vx + Math.sin(p.ph) * 0.15) * dt;
      p.y += p.vy * dt;
      p.ph += p.phs * dt;
      p.rot += p.vrot * dt;
      if(p.a < 0.9) p.a += 0.04 * dt;
      if(p.y > H * 0.9) p.a -= 0.04 * dt;
      if(p.y > H + 20 || p.a <= 0){ petals.splice(i, 1); continue; }
      var xx = p.x + Math.sin(p.ph) * p.amp;
      var s = p.size * 2.2;
      ctx.globalAlpha = p.a;
      ctx.save();
      ctx.translate(xx, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(petalSprite, -s * 0.5, -s * 0.5, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function updateOrnaments(time, dt){
    for(var i = 0; i < ornaments.length; i++){
      var o = ornaments[i];
      var target = wind.v * 0.05 + Math.sin(time * 1.0 + o.phase) * 0.04;
      o.swingV += (target - o.swing) * 0.06 * dt;
      o.swingV *= Math.pow(0.92, dt);
      o.swing += o.swingV * dt;
      var ang = o.swing;
      var tx = o.x + Math.sin(ang) * o.drop;
      var ty = o.y + Math.cos(ang) * o.drop;
      o.el.style.transform =
        "translate(" + (tx|0) + "px," + (ty|0) + "px) rotate(" + (ang * 14).toFixed(2) + "deg) translate(-50%,0)";
    }
  }

  function updateWind(dt){
    wind.t -= dt;
    if(wind.t <= 0){
      wind.target = (Math.random() - 0.4) * 0.5;
      wind.t = (3 + Math.random() * 5) * 60;
    }
    wind.v += (wind.target - wind.v) * 0.012 * dt;
  }

  var last = performance.now();
  function frame(now){
    if(!running) return;
    var dt = Math.min(2.5, (now - last) / 16.666);
    last = now;
    var time = (now - t0) / 1000;

    mouse.x += (mouse.tx - mouse.x) * 0.03;
    mouse.y += (mouse.ty - mouse.y) * 0.03;

    if(!reduce.matches){
      updateWind(dt);
      animate(time);
      draw(time);
      drawPetals(dt);
      updateOrnaments(time, dt);
    } else {
      for(var i = 0; i < clouds.length; i++){
        clouds[i].x = clouds[i].rx;
        clouds[i].y = clouds[i].ry;
      }
      draw(0);
      updateOrnaments(0, 1);
    }
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if(running) return;
    running = true;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "medium";
    petals = [];
    buildCanopySprite(isLight());
    buildTree();
  }

  window.addEventListener("resize", (function(){
    var z; return function(){ clearTimeout(z); z = setTimeout(resize, 140); };
  })(), { passive: true });
  window.addEventListener("pointermove", function(e){
    mouse.tx = e.clientX / window.innerWidth;
    mouse.ty = e.clientY / window.innerHeight;
  }, { passive: true });
  window.addEventListener("pointerdown", function(e){
    if(e.target.closest && e.target.closest("a,button")) return;
    wind.target = (e.clientX / W - 0.5) * 0.9;
    wind.t = 2 * 60;
    for(var i = 0; i < 8; i++) spawnPetal();
  }, { passive: true });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stop(); else start();
  });
  if(reduce.addEventListener) reduce.addEventListener("change", function(){ if(!reduce.matches) start(); });

  resize();
  start();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080f">
<meta name="description" content="kidandcat — a living sakura tree of tools.">
<title>kidandcat</title>
<style>
:root{
  --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
html[data-theme="dark"]{
  --bg-0:#05060c; --bg-1:#0a0c17; --sky-top:#070a18; --sky-mid:#161028; --glow-warm:#3a1a24;
  --ink:#eef1fb; --ink-dim:#9aa2be; --ink-faint:#5a627e;
  --line-strong:rgba(150,175,255,0.30);
  --accent:#57e6ff; --accent-3:#ff6ea9;
  --panel:rgba(12,16,32,0.55); --panel-brd:rgba(120,150,230,0.22);
  --string:rgba(255,210,230,0.5); --glow-a:rgba(87,230,255,0.45);
  --badge-ring:rgba(255,255,255,0.14); --badge-shadow:0 10px 28px -8px rgba(0,0,0,.65);
}
html[data-theme="light"]{
  --bg-0:#e8ecf6; --bg-1:#f3f5fb; --sky-top:#e6eefb; --sky-mid:#f6e8ef; --glow-warm:#ffe4cc;
  --ink:#161a26; --ink-dim:#4c5470; --ink-faint:#8b93ac;
  --line-strong:rgba(40,60,130,0.22);
  --accent:#0a97b8; --accent-3:#d24f86;
  --panel:rgba(255,255,255,0.7); --panel-brd:rgba(40,60,130,0.14);
  --string:rgba(120,60,80,0.4); --glow-a:rgba(10,151,184,0.3);
  --badge-ring:rgba(0,0,0,0.08); --badge-shadow:0 12px 28px -12px rgba(30,45,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100svh; min-height:100dvh;
  font-family:var(--font-sans); color:var(--ink);
  background:var(--bg-1); overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .6s ease, color .6s ease;
}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .sky{
  position:absolute;inset:-8%;
  background:
    radial-gradient(100% 70% at 55% 20%, var(--sky-mid) 0%, transparent 58%),
    radial-gradient(80% 55% at 20% 100%, var(--glow-warm) 0%, transparent 55%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
}
.bg .aura{position:absolute;inset:0;mix-blend-mode:screen;opacity:.85}
html[data-theme="light"] .bg .aura{mix-blend-mode:multiply;opacity:.45}
.bg .aura b{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 28s ease-in-out infinite alternate;will-change:transform}
@media (max-width:820px){
  .bg .aura b{animation:none;filter:blur(50px)}
}
.bg .aura .a1{width:48vmax;height:48vmax;left:40%;top:-20%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.12}
.bg .aura .a2{width:40vmax;height:40vmax;left:-14%;top:50%;background:radial-gradient(circle,#ffb570 0%,transparent 62%);opacity:.12;animation-delay:-10s}
.bg .aura .a3{width:36vmax;height:36vmax;left:62%;top:52%;background:radial-gradient(circle,var(--accent-3) 0%,transparent 62%);opacity:.14;animation-delay:-16s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,-2.5%,0) scale(1.1)}}

#tree{position:fixed;inset:0;z-index:1;width:100%;height:100%;display:block;pointer-events:none}
.ground{
  position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:2;pointer-events:none;
  background:linear-gradient(180deg, transparent 0%, color-mix(in oklab, var(--bg-0) 55%, transparent) 70%, var(--bg-0) 100%);
  opacity:.85;
}

.hud{position:fixed;inset:0;z-index:6;pointer-events:none}
.hud .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--line-strong)}
.hud .tl{top:14px;left:14px;border-right:0;border-bottom:0}
.hud .tr{top:14px;right:14px;border-left:0;border-bottom:0}
.hud .bl{bottom:14px;left:14px;border-right:0;border-top:0}
.hud .br{bottom:14px;right:14px;border-left:0;border-top:0}

.chrome{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(14px,2vw,22px);
}
.chrome a,.chrome button{pointer-events:auto}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.brand{
  display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  font-weight:800;letter-spacing:-0.02em;font-size:clamp(1rem,2vw,1.15rem);text-transform:none;
}
.brand .cat{
  background:linear-gradient(180deg, var(--accent-3) 0%, color-mix(in oklab, var(--accent) 50%, var(--accent-3)) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow-a);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow-a)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status{display:flex;align-items:center;gap:9px}

.toggle{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border:1px solid var(--panel-brd);
  padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);
  transition:color .2s,border-color .2s,transform .15s;
}
.toggle:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toggle svg{width:14px;height:14px;display:block}
.toggle .ti-sun{display:none}
html[data-theme="light"] .toggle .ti-sun{display:block}
html[data-theme="light"] .toggle .ti-moon{display:none}

.foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
}
.links{display:flex;gap:14px}
.links a{color:var(--ink-dim);text-decoration:none;transition:color .15s}
.links a:hover{color:var(--ink)}

/* Logo badges hanging from branches */
#ornaments{position:fixed;inset:0;z-index:3;pointer-events:none}
.orn{
  position:absolute;left:0;top:0;
  pointer-events:auto;
  will-change:transform;
  text-decoration:none;
  color:inherit;
}
.orn::before{
  content:"";
  position:absolute;left:50%;top:-30px;
  width:1px;height:30px;
  background:linear-gradient(180deg, transparent, var(--string));
  transform:translateX(-50%);
}
.orn .knot{
  position:absolute;left:50%;top:-5px;
  width:6px;height:6px;border-radius:50%;
  background:color-mix(in oklab, #6b3f2a 70%, var(--accent-3));
  transform:translateX(-50%);
  box-shadow:0 0 0 2px color-mix(in oklab, var(--panel) 80%, transparent);
}
.orn .badge{
  width:48px;height:48px;border-radius:14px;
  display:grid;place-items:center;
  background:var(--badge-bg, #111);
  border:1.5px solid var(--badge-ring);
  box-shadow:
    var(--badge-shadow),
    0 0 0 1px color-mix(in oklab, var(--brand, #fff) 35%, transparent),
    0 0 22px -6px color-mix(in oklab, var(--brand, #fff) 55%, transparent);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
  overflow:hidden;
}
.orn:hover .badge{
  transform:scale(1.1);
  box-shadow:
    0 16px 36px -10px rgba(0,0,0,.55),
    0 0 0 2px color-mix(in oklab, var(--brand, #fff) 60%, transparent),
    0 0 32px -4px color-mix(in oklab, var(--brand, #fff) 70%, transparent);
}
.orn:focus-visible{outline:none}
.orn:focus-visible .badge{outline:2px solid var(--accent);outline-offset:3px}
.orn .badge img{
  width:70%;height:70%;object-fit:contain;
  display:block;
  /* keep brand colors — don't invert */
  filter:none;
}
.orn .label{
  position:absolute;left:50%;top:calc(100% + 6px);
  transform:translateX(-50%);
  font-family:var(--font-mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;
  opacity:0;transition:opacity .2s;
  pointer-events:none;
  text-shadow:0 1px 8px var(--bg-0);
}
.orn:hover .label{opacity:1}

@media (max-width:560px){
  .orn .badge{width:40px;height:40px;border-radius:12px}
  .foot .hint{display:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .dot{box-shadow:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="sky"></div>
  <div class="aura"><b class="a1"></b><b class="a2"></b><b class="a3"></b></div>
</div>

<canvas id="tree" aria-hidden="true"></canvas>
<div class="ground" aria-hidden="true"></div>
<div id="ornaments" aria-label="Tools hanging from the tree"></div>

<div class="hud" aria-hidden="true">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>
</div>

<div class="chrome">
  <header class="top">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>kidand<span class="cat">cat</span></a>
    <span class="status"><span>under the sakura</span></span>
    <button class="toggle" id="themeBtn" type="button" aria-label="Toggle color theme" aria-pressed="false">
      <svg class="ti-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ti-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
      <span>theme</span>
    </button>
  </header>
  <footer class="foot">
    <span class="hint">/// click for wind · tools hang from the branches</span>
    <nav class="links" aria-label="Elsewhere">
      <a href="https://github.com/kidandcat" target="_blank" rel="me noopener noreferrer">github</a>
      <a href="https://x.com/kidandcat" target="_blank" rel="me noopener noreferrer">x</a>
    </nav>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var root = document.documentElement;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var KEY = "kac-theme";

  function applyTheme(t){
    root.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#05060c" : "#eef1f7");
    var btn = document.getElementById("themeBtn");
    if(btn) btn.setAttribute("aria-pressed", String(t === "light"));
  }
  var saved; try{ saved = localStorage.getItem(KEY); }catch(e){}
  applyTheme(saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  document.getElementById("themeBtn").addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY, next); }catch(e){}
  });

  /* Tools with brand colors + local favicons */
  var TOOLS = [
    { name: "Hyperframes", href: "https://hyperframes.heygen.com/", icon: "icons/hyperframes.png", brand: "#A78BFA", bg: "#14101f" },
    { name: "Impeccable",  href: "https://impeccable.style/",       icon: "icons/impeccable.png",  brand: "#C9A227", bg: "#111111" },
    { name: "Claude",      href: "https://claude.ai/code",          icon: "icons/claude.png",      brand: "#D97757", bg: "#2a1810" },
    { name: "Grok",        href: "https://grok.x.ai/",              icon: "icons/grok.png",        brand: "#E8E8E8", bg: "#0a0a0a" },
    { name: "Takan",       href: "https://takan.es",                icon: "icons/takan.png",       brand: "#6C5CE7", bg: "#14102a" },
    { name: "shot",        href: "https://github.com/kidandcat/shot", icon: "icons/shot.png",      brand: "#F0F6FC", bg: "#0d1117" },
    { name: "Flutter",     href: "https://flutter.dev",             icon: "icons/flutter.png",     brand: "#45D1FD", bg: "#042a3a" },
    { name: "Go",          href: "https://go.dev",                  icon: "icons/go.png",          brand: "#00ADD8", bg: "#06222b" },
    { name: "Rust",        href: "https://www.rust-lang.org",       icon: "icons/rust.png",        brand: "#DEA584", bg: "#1a120c" },
    { name: "Tailscale",   href: "https://tailscale.com",           icon: "icons/tailscale.png",   brand: "#8B93A7", bg: "#111318" }
  ];

  var canvas = document.getElementById("tree");
  // desynchronized: lower latency; alpha needed for sky under tree
  var ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  var W = 0, H = 0, DPR = 1;
  var t0 = performance.now();
  var mouse = { x: 0.5, y: 0.4, tx: 0.5, ty: 0.4 };
  var wind = { v: 0.12, target: 0.12, gustT: 100 };
  var petals = [], nodes = [], flat = [], hangSlots = [], ornaments = [], blooms = [];
  var drawOrder = []; // pre-sorted by depth once per build
  var running = false, raf = null, seed = 20260730;
  var baseX = 0, baseY = 0;
  var bloomSprites = []; // pre-rendered soft flowers — stamped with drawImage
  var petalSprite = null;
  var quality = 1; // 1 = full, 0.5 = thrifty (auto after lag)
  var frameBudgetMs = 16.5;
  var skipPetals = false;
  var MAX_BLOOMS = 900;
  var MAX_PETALS = 40;
  var barkPalette = null;

  function rand(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var n = Math.imul(seed ^ seed >>> 15, 1 | seed);
    n = n + Math.imul(n ^ n >>> 7, 61 | n) ^ n;
    return ((n ^ n >>> 14) >>> 0) / 4294967296;
  }
  function rrange(a, b){ return a + rand() * (b - a); }
  function isLight(){ return root.getAttribute("data-theme") === "light"; }

  function makeNode(parent, len, angle, depth, thick){
    var n = {
      parent: parent, children: [],
      len: len, angle0: angle, thick: thick, depth: depth,
      phase: rrange(0, Math.PI * 2),
      flex: 0.016 + depth * 0.013,
      x: 0, y: 0, x2: 0, y2: 0, absAng: 0
    };
    nodes.push(n); flat.push(n);
    if(parent) parent.children.push(n);
    return n;
  }

  function buildTree(){
    nodes = []; flat = []; hangSlots = []; blooms = []; drawOrder = [];
    seed = 20260730;

    var mobile = W < 720;
    var hiDpr = (window.devicePixelRatio || 1) > 1.5;
    baseX = W * 0.52;
    baseY = H * 0.96;
    var scale = Math.min(W, H) / (mobile ? 420 : 700);
    // slightly shallower on heavy displays — still dense, fewer draw calls
    var maxDepth = mobile ? 8 : (hiDpr ? 9 : 10);

    var trunkLen = Math.min(H * (mobile ? 0.22 : 0.28), mobile ? 170 : 260);
    var trunk = makeNode(null, trunkLen, -Math.PI / 2, 0, (mobile ? 16 : 26) * scale);

    function grow(node, depth){
      if(depth >= maxDepth || node.len < 10 * scale){
        addCluster(node, scale, true);
        if(depth >= 3) hangSlots.push({ node: node, along: 0.9, prefer: depth <= 6 ? 1 : 0.35 });
        return;
      }

      var childCount;
      if(depth === 0) childCount = 1;
      else if(depth === 1) childCount = mobile ? 5 : 6;
      else if(depth === 2) childCount = 3 + (rand() < 0.5 ? 1 : 0);
      else if(depth < 5) childCount = rand() < 0.65 ? 2 : 3;
      else if(depth < 8) childCount = rand() < 0.5 ? 2 : 1;
      else childCount = rand() < 0.4 ? 2 : 1;

      if(depth === 0){
        var cont = makeNode(node, node.len * 0.78, rrange(-0.05, 0.05), 1, node.thick * 0.8);
        hangSlots.push({ node: cont, along: 0.5, prefer: 1.1 });
        grow(cont, 1);

        var limbs = mobile ? 4 : 5;
        for(var L = 0; L < limbs; L++){
          var side = L % 2 === 0 ? -1 : 1;
          var elev = 0.55 + L * 0.12 + rrange(-0.05, 0.05);
          var ang = side * elev + rrange(-0.06, 0.06);
          var len = node.len * (0.55 + rand() * 0.22);
          var limb = makeNode(node, len, ang, 1, node.thick * (0.42 + rand() * 0.1));
          hangSlots.push({ node: limb, along: 0.85, prefer: 1.3 });
          addCluster(limb, scale, false);
          grow(limb, 2);
        }
        return;
      }

      for(var i = 0; i < childCount; i++){
        var spread;
        if(depth === 1){
          spread = -1.15 + (i / Math.max(1, childCount - 1)) * 2.3 + rrange(-0.07, 0.07);
        } else {
          var fan = 0.42 + rand() * 0.38;
          spread = (i - (childCount - 1) / 2) * fan + rrange(-0.1, 0.1);
        }
        var shrink = depth === 1 ? 0.74 : (0.68 + rand() * 0.14);
        if(depth === 1 && Math.abs(spread) > 0.7) shrink *= 1.1;
        var nextLen = node.len * shrink;
        var nextThick = Math.max(0.9 * scale, node.thick * (depth < 3 ? 0.64 : 0.7));
        var child = makeNode(node, nextLen, spread, depth + 1, nextThick);

        if(depth >= 1 && depth <= 5 && rand() < 0.5){
          hangSlots.push({
            node: child,
            along: 0.72 + rand() * 0.22,
            prefer: (depth <= 3 ? 1.0 : 0.45) + (Math.abs(spread) > 0.5 ? 0.35 : 0)
          });
        }

        if(depth >= 3 && rand() < (depth < 6 ? 0.28 : 0.14)) addCluster(child, scale, false);

        grow(child, depth + 1);
      }

      if(depth > 1 && depth < 7 && rand() < 0.35){
        var spur = makeNode(node, node.len * rrange(0.35, 0.5),
          (rand() < 0.5 ? -1 : 1) * rrange(0.5, 1.0), depth + 2, node.thick * 0.55);
        addCluster(spur, scale, true);
        grow(spur, depth + 2);
      }
    }

    grow(trunk, 0);
    poseRest();
    drawOrder = flat.slice().sort(function(a, b){ return a.depth - b.depth; });
    // cache stroke widths
    for(var di = 0; di < drawOrder.length; di++){
      var dn = drawOrder[di];
      dn.lw = Math.max(0.7, dn.thick * (1 - dn.depth * 0.012));
    }

    hangSlots.forEach(function(s){
      var p = pointOn(s.node, s.along);
      s.score = (s.prefer || 0.5)
        + (p.y / H) * 0.7
        + Math.abs(p.x - baseX) / W * 0.45
        - (p.y < H * 0.18 ? 1.4 : 0);
    });
    hangSlots.sort(function(a, b){ return b.score - a.score; });
    assignOrnaments();
  }

  function addCluster(node, scale, isTip){
    if(blooms.length >= MAX_BLOOMS) return;
    var n = isTip ? (3 + (rand() * 3 | 0)) : (1 + (rand() * 2 | 0));
    for(var i = 0; i < n && blooms.length < MAX_BLOOMS; i++){
      blooms.push({
        node: node,
        along: isTip ? (0.5 + rand() * 0.48) : (0.25 + rand() * 0.6),
        ox: rrange(-14, 14) * scale,
        oy: rrange(-12, 10) * scale,
        r: rrange(3.2, 7.5) * scale * (isTip ? 1 : 0.88),
        sprite: (rand() * 8) | 0,
        tw: rrange(0, Math.PI * 2),
        tws: rrange(0.4, 1.2)
      });
    }
  }

  /* Pre-render soft blossoms once — drawImage is ~50× cheaper than gradients/frame */
  function buildSprites(light){
    bloomSprites = [];
    var size = 64;
    for(var s = 0; s < 8; s++){
      var c = document.createElement("canvas");
      c.width = size; c.height = size;
      var g = c.getContext("2d");
      var cx = size / 2, cy = size / 2, R = 18 + (s % 3) * 2;
      var pinkA = light ? "255,175,200" : "255,150,190";
      var pinkB = light ? "255,145,180" : "255,120,170";
      var pinkC = light ? "255,215,230" : "255,190,215";
      var rot = s * 0.4;

      var haze = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.6);
      haze.addColorStop(0, "rgba(" + pinkA + ",0.2)");
      haze.addColorStop(1, "rgba(" + pinkB + ",0)");
      g.fillStyle = haze;
      g.beginPath(); g.arc(cx, cy, R * 1.6, 0, Math.PI * 2); g.fill();

      for(var i = 0; i < 5; i++){
        var a = (i / 5) * Math.PI * 2 + rot;
        var px = cx + Math.cos(a) * R * 0.38;
        var py = cy + Math.sin(a) * R * 0.34;
        var pr = R * 0.5;
        var pg = g.createRadialGradient(px, py, 0, px, py, pr);
        pg.addColorStop(0, "rgba(" + pinkC + ",0.7)");
        pg.addColorStop(0.65, "rgba(" + pinkA + ",0.35)");
        pg.addColorStop(1, "rgba(" + pinkB + ",0)");
        g.fillStyle = pg;
        g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = light ? "rgba(255,235,245,0.55)" : "rgba(255,220,235,0.5)";
      g.beginPath(); g.arc(cx, cy, R * 0.18, 0, Math.PI * 2); g.fill();
      if(s > 3){
        g.fillStyle = light ? "rgba(255,205,90,0.55)" : "rgba(255,190,80,0.45)";
        g.beginPath(); g.arc(cx, cy, 1.2, 0, Math.PI * 2); g.fill();
      }
      bloomSprites.push(c);
    }

    // falling petal sprite
    petalSprite = document.createElement("canvas");
    petalSprite.width = 24; petalSprite.height = 24;
    var pctx = petalSprite.getContext("2d");
    pctx.translate(12, 12);
    pctx.fillStyle = light ? "rgba(233,145,180,0.9)" : "rgba(255,170,200,0.9)";
    pctx.beginPath();
    pctx.moveTo(0, -8);
    pctx.bezierCurveTo(5, -4, 4, 5, 0, 8);
    pctx.bezierCurveTo(-4, 5, -5, -4, 0, -8);
    pctx.fill();

    barkPalette = light
      ? ["#4a2c22", "#5c382c", "#6e4638", "rgba(120,78,62,0.82)"]
      : ["#2a1a18", "#3a2622", "#4a322c", "rgba(88,60,54,0.85)"];
  }

  function poseRest(){
    for(var i = 0; i < flat.length; i++){
      var n = flat[i];
      if(!n.parent){ n.x = baseX; n.y = baseY; n.absAng = n.angle0; }
      else { n.x = n.parent.x2; n.y = n.parent.y2; n.absAng = n.parent.absAng + n.angle0; }
      n.x2 = n.x + Math.cos(n.absAng) * n.len;
      n.y2 = n.y + Math.sin(n.absAng) * n.len;
    }
  }

  function pointOn(node, along){
    return {
      x: node.x + (node.x2 - node.x) * along,
      y: node.y + (node.y2 - node.y) * along
    };
  }

  function assignOrnaments(){
    var host = document.getElementById("ornaments");
    host.innerHTML = "";
    ornaments = [];

    var chosen = [];
    var minDx = Math.max(72, W * 0.07);
    var toolLimit = TOOLS.length;

    for(var i = 0; i < hangSlots.length && chosen.length < toolLimit; i++){
      var s = hangSlots[i];
      var p = pointOn(s.node, s.along);
      if(p.x < 50 || p.x > W - 50 || p.y < 48 || p.y > H * 0.78) continue;
      var ok = true;
      for(var j = 0; j < chosen.length; j++){
        var q = pointOn(chosen[j].node, chosen[j].along);
        if(Math.abs(q.x - p.x) < minDx && Math.abs(q.y - p.y) < 56){ ok = false; break; }
      }
      if(ok) chosen.push(s);
    }
    for(var k = 0; k < hangSlots.length && chosen.length < toolLimit; k++){
      if(chosen.indexOf(hangSlots[k]) === -1){
        var pp = pointOn(hangSlots[k].node, hangSlots[k].along);
        if(pp.x > 40 && pp.x < W - 40 && pp.y < H * 0.8) chosen.push(hangSlots[k]);
      }
    }

    for(var t = 0; t < toolLimit && t < chosen.length; t++){
      var tool = TOOLS[t];
      var slot = chosen[t];
      var a = document.createElement("a");
      a.className = "orn";
      a.href = tool.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.title = tool.name;
      a.innerHTML =
        '<span class="knot" aria-hidden="true"></span>' +
        '<span class="badge"><img alt="" width="32" height="32" decoding="async"></span>' +
        '<span class="label"></span>';
      a.style.setProperty("--brand", tool.brand);
      a.querySelector(".badge").style.setProperty("--badge-bg", tool.bg);
      a.querySelector(".badge").style.background = tool.bg;
      var img = a.querySelector("img");
      img.src = tool.icon;
      img.alt = tool.name;
      a.querySelector(".label").textContent = tool.name;
      host.appendChild(a);
      ornaments.push({ el: a, slot: slot, swing: 0, swingV: 0, drop: 28 + (t % 4) * 7 });
    }
  }

  function animateStructure(time){
    var gust = wind.v;
    var mx = (mouse.x - 0.5);
    var breeze = Math.sin(time * 1.05) * 0.55 + Math.sin(time * 0.33) * 0.25 + gust;
    for(var i = 0; i < flat.length; i++){
      var n = flat[i];
      var localWind = (breeze + Math.sin(time + n.phase) * 0.35) * n.flex
        + mx * (0.03 + n.depth * 0.009);
      if(!n.parent){
        n.x = baseX; n.y = baseY;
        n.absAng = n.angle0 + localWind * 0.22;
      } else {
        n.x = n.parent.x2; n.y = n.parent.y2;
        n.absAng = n.parent.absAng + n.angle0 + localWind;
      }
      n.x2 = n.x + Math.cos(n.absAng) * n.len;
      n.y2 = n.y + Math.sin(n.absAng) * n.len;
    }
  }

  function barkColor(depth){
    if(depth < 1) return barkPalette[0];
    if(depth < 3) return barkPalette[1];
    if(depth < 5) return barkPalette[2];
    return barkPalette[3];
  }

  function drawTree(time){
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = isLight() ? "rgba(40,30,50,0.08)" : "rgba(0,0,0,0.28)";
    ctx.beginPath();
    ctx.ellipse(baseX, baseY - 2, Math.min(W, H) * 0.14, Math.min(W, H) * 0.025, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    var lastStyle = "";
    var step = quality < 1 ? 2 : 1;
    for(var i = 0; i < drawOrder.length; i++){
      var n = drawOrder[i];
      if(step > 1 && n.depth > 6 && (i & 1)) continue;
      var style = barkColor(n.depth);
      if(style !== lastStyle){ ctx.strokeStyle = style; lastStyle = style; }
      ctx.lineWidth = n.lw;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      if(n.depth < 4){
        var mx2 = (n.x + n.x2) * 0.5 + Math.sin(time * 0.7 + n.phase) * 1.2;
        var my2 = (n.y + n.y2) * 0.5;
        ctx.quadraticCurveTo(mx2, my2, n.x2, n.y2);
      } else {
        ctx.lineTo(n.x2, n.y2);
      }
      ctx.stroke();
    }

    var sprites = bloomSprites;
    if(!sprites.length) return;
    var bloomStep = quality < 1 ? 2 : 1;
    for(var b = 0; b < blooms.length; b += bloomStep){
      var bl = blooms[b];
      var nd = bl.node;
      var bx = nd.x + (nd.x2 - nd.x) * bl.along + bl.ox;
      var by = nd.y + (nd.y2 - nd.y) * bl.along + bl.oy;
      var r = bl.r;
      if(quality >= 1) r *= 0.97 + Math.sin(time * bl.tws + bl.tw) * 0.03;
      var spr = sprites[bl.sprite];
      var sz = r * 3.4;
      ctx.drawImage(spr, bx - sz * 0.5, by - sz * 0.5, sz, sz);
    }
  }

  function spawnPetal(fromBloom){
    if(petals.length >= MAX_PETALS || skipPetals) return;
    var x, y;
    if(fromBloom && blooms.length){
      var bl = blooms[(Math.random() * blooms.length) | 0];
      var nd = bl.node;
      x = nd.x + (nd.x2 - nd.x) * bl.along + bl.ox;
      y = nd.y + (nd.y2 - nd.y) * bl.along + bl.oy;
    } else {
      x = baseX + (Math.random() - 0.5) * W * 0.45;
      y = H * (0.1 + Math.random() * 0.28);
    }
    petals.push({
      x: x, y: y,
      size: 3 + Math.random() * 5,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.07,
      vy: 0.3 + Math.random() * 0.85,
      vx: wind.v * 0.5 + (Math.random() - 0.35) * 0.5,
      amp: 12 + Math.random() * 28,
      ph: Math.random() * Math.PI * 2,
      phs: 0.01 + Math.random() * 0.02,
      a: 0
    });
  }

  function drawPetals(dt){
    if(skipPetals){ petals.length = 0; return; }
    if(!reduce.matches){
      var rate = 0.35 + Math.abs(wind.v) * 0.8;
      if(Math.random() < rate * dt * 0.05) spawnPetal(true);
    }
    if(!petalSprite) return;
    for(var i = petals.length - 1; i >= 0; i--){
      var p = petals[i];
      p.vy += 0.0035 * dt;
      p.vx += wind.v * 0.012 * dt;
      p.vx *= 0.995;
      p.x += (p.vx + Math.sin(p.ph) * 0.18) * dt;
      p.y += p.vy * dt;
      p.ph += p.phs * dt;
      p.rot += p.vrot * dt;
      if(p.a < 0.9) p.a += 0.04 * dt;
      if(p.y > H * 0.9) p.a -= 0.04 * dt;
      if(p.y > H + 24 || p.a <= 0 || p.x < -40 || p.x > W + 40){ petals.splice(i, 1); continue; }
      var xx = p.x + Math.sin(p.ph) * p.amp;
      var s = p.size * 2.2;
      ctx.globalAlpha = p.a;
      ctx.save();
      ctx.translate(xx, p.y);
      ctx.rotate(p.rot);
      ctx.drawImage(petalSprite, -s * 0.5, -s * 0.5, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function updateOrnaments(time, dt){
    for(var i = 0; i < ornaments.length; i++){
      var o = ornaments[i];
      var nd = o.slot.node;
      var along = o.slot.along;
      var px = nd.x + (nd.x2 - nd.x) * along;
      var py = nd.y + (nd.y2 - nd.y) * along;
      var target = wind.v * 0.14 + Math.sin(time * 1.25 + i * 0.9) * 0.07 + (mouse.x - 0.5) * 0.1;
      o.swingV += (target - o.swing) * 0.09 * dt;
      o.swingV *= Math.pow(0.9, dt);
      o.swing += o.swingV * dt;
      var ang = o.swing;
      var tx = px + Math.sin(ang) * o.drop;
      var ty = py + Math.cos(ang) * o.drop;
      o.el.style.transform =
        "translate(" + (tx|0) + "px," + (ty|0) + "px) rotate(" + (ang * 16).toFixed(2) + "deg) translate(-50%,0)";
    }
  }

  function updateWind(time, dt){
    wind.gustT -= dt;
    if(wind.gustT <= 0){
      wind.target = (Math.random() - 0.3) * 1.6;
      wind.gustT = (2 + Math.random() * 5) * 60;
    }
    wind.v += (wind.target - wind.v) * 0.018 * dt;
    wind.v += Math.sin(time * 0.35) * 0.003 * dt;
  }

  var last = performance.now();
  var avgFrame = 16;
  var themeWatch = root.getAttribute("data-theme");
  function frame(now){
    if(!running) return;
    var frameMs = now - last;
    var dt = Math.min(2.5, frameMs / 16.666);
    last = now;
    var time = (now - t0) / 1000;

    avgFrame = avgFrame * 0.9 + frameMs * 0.1;
    if(avgFrame > 28){ quality = 0.5; skipPetals = avgFrame > 40; }
    else if(avgFrame < 18){ quality = 1; skipPetals = false; }

    var th = root.getAttribute("data-theme");
    if(th !== themeWatch){
      themeWatch = th;
      buildSprites(th === "light");
    }

    mouse.x += (mouse.tx - mouse.x) * 0.06;
    mouse.y += (mouse.ty - mouse.y) * 0.06;

    if(!reduce.matches){
      updateWind(time, dt);
      animateStructure(time);
      drawTree(time);
      if(quality >= 1 || ((now / 33) | 0) % 2 === 0) drawPetals(dt);
      updateOrnaments(time, dt);
    } else {
      poseRest();
      drawTree(0);
      updateOrnaments(0, 1);
    }
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if(running) return;
    running = true;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop(){
    running = false;
    if(raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function resize(){
    // Cap DPR — 2× retina fillrate is the main lag source on big screens
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // imageSmoothing for soft sprites at non-integer sizes
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "low";
    petals = [];
    buildSprites(isLight());
    buildTree();
    poseRest();
  }

  window.addEventListener("resize", (function(){
    var z; return function(){ clearTimeout(z); z = setTimeout(resize, 120); };
  })(), { passive: true });
  window.addEventListener("pointermove", function(e){
    mouse.tx = e.clientX / window.innerWidth;
    mouse.ty = e.clientY / window.innerHeight;
  }, { passive: true });
  window.addEventListener("pointerdown", function(e){
    if(e.target.closest && e.target.closest("a,button")) return;
    wind.target = (e.clientX / W - 0.5) * 2.8;
    wind.gustT = 2.5 * 60;
    for(var i = 0; i < 6; i++) spawnPetal(true);
  }, { passive: true });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stop(); else start();
  });
  if(reduce.addEventListener) reduce.addEventListener("change", function(){ if(!reduce.matches) start(); });

  resize();
  start();
})();
</script>
</body>
</html>
